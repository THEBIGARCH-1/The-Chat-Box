<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cloud Room Chat</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d0e15; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #chat-container { width: 90vw; max-width: 800px; height: 85vh; background: #1a1d2e; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #3b4252; }
        #chat-header { padding: 16px 20px; background: #141625; border-bottom: 1px solid #2e3440; display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 12px; padding: 6px 12px; border-radius: 12px; background: #a3be8c; color: #1a1d2e; font-weight: bold; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #2e3440; padding: 10px 14px; border-radius: 8px; max-width: 75%; width: fit-content; word-break: break-word; }
        .msg.self { align-self: flex-end; background: #5e81ac; }
        .msg .sender { font-size: 11px; color: #d8dee9; margin-bottom: 3px; display: block; font-weight: bold; }
        #input-area { padding: 15px; background: #141625; display: flex; gap: 10px; border-top: 1px solid #2e3440; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #3b4252; background: #2e3440; color: #fff; outline: none; }
        button { padding: 12px 20px; background: #88c0d0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #1a1d2e; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 10; }
        .modal { background: #1a1d2e; padding: 30px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; text-align: center; width: 320px; border: 1px solid #3b4252; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="modal">
            <h2>Enter Live Room</h2>
            <p style="font-size: 12px; color: #88c0d0;">Enter a name & room code to talk anywhere!</p>
            <input type="text" id="username" placeholder="Your Name" maxlength="15">
            <input type="text" id="roomcode" placeholder="Room Code (e.g. CHAT99)" maxlength="15">
            <button onclick="joinRoom()">Join Room</button>
        </div>
    </div>

    <div id="chat-container">
        <div id="chat-header">
            <span id="room-display" style="font-weight: bold;">Room: ----</span>
            <span id="status-badge" class="status">Connected to Cloud</span>
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="message-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">Send</button>
        </div>
    </div>

    <script>
        // PASTE YOUR FIREBASE REALTIME DATABASE URL HERE:
        const FIREBASE_DB_URL = "YOUR_FIREBASE_DATABASE_URL_HERE";

        let db = null;
        let myName = "User";
        let roomCode = "";

        function joinRoom() {
            myName = document.getElementById('username').value.trim() || "User";
            roomCode = document.getElementById('roomcode').value.trim().toUpperCase();

            if (!roomCode) {
                alert("Please enter a room code!");
                return;
            }

            if (FIREBASE_DB_URL === "YOUR_FIREBASE_DATABASE_URL_HERE") {
                alert("Please add your Firebase Database URL inside the code!");
                return;
            }

            // Initialize Firebase
            firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
            db = firebase.database();

            document.getElementById('room-display').innerText = "Room: " + roomCode;
            document.getElementById('overlay').style.display = 'none';

            addSystemMsg(`Joined room [${roomCode}]. Tell your friends to enter code: ${roomCode}`);

            // Listen for new incoming messages in this specific Room Code
            db.ref('rooms/' + roomCode).on('child_added', (snapshot) => {
                const msg = snapshot.val();
                addMsg(msg.sender, msg.text, msg.sender === myName);
            });
        }

        function send() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !db) return;

            // Push message directly to cloud database
            db.ref('rooms/' + roomCode).push({
                sender: myName,
                text: text,
                timestamp: Date.now()
            });

            input.value = "";
        }

        function addMsg(sender, text, isSelf) {
            const box = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `msg ${isSelf ? 'self' : ''}`;
            div.innerHTML = `<span class="sender">${sender}</span>${escape(text)}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function addSystemMsg(text) {
            const box = document.getElementById('messages');
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.fontSize = '12px';
            div.style.color = '#88c0d0';
            div.style.margin = '4px 0';
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function escape(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
