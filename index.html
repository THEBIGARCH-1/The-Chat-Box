<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberChat // Retro-Futuristic Terminal</title>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        /* Dynamic Theme Palettes */
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.5);
            --secondary: #a855f7;
            --secondary-glow: rgba(168, 85, 247, 0.4);
            --bg-base: #04020a;
            --bg-panel: #06040f;
            --bg-card: #0a0816;
            --bg-input: #0b091c;
            --text-main: #f3f4f6;
            --text-accent: #60a5fa;
            --accent-glow: #3b82f6;
        }

        body.theme-matrix {
            --primary: #00ffcc;
            --primary-glow: rgba(0, 255, 204, 0.5);
            --secondary: #22c55e;
            --secondary-glow: rgba(34, 197, 94, 0.4);
            --bg-base: #020804;
            --bg-panel: #040c06;
            --bg-card: #07150a;
            --bg-input: #0a1f0e;
            --text-main: #e2fef0;
            --text-accent: #4ade80;
            --accent-glow: #00ffcc;
        }

        body.theme-synthwave {
            --primary: #ec4899;
            --primary-glow: rgba(236, 72, 153, 0.5);
            --secondary: #f43f5e;
            --secondary-glow: rgba(244, 63, 94, 0.4);
            --bg-base: #090206;
            --bg-panel: #11030d;
            --bg-card: #1c0515;
            --bg-input: #29081e;
            --text-main: #fdf2f8;
            --text-accent: #f472b6;
            --accent-glow: #ec4899;
        }

        body.theme-acid {
            --primary: #eab308;
            --primary-glow: rgba(234, 179, 8, 0.5);
            --secondary: #f97316;
            --secondary-glow: rgba(249, 115, 22, 0.4);
            --bg-base: #080502;
            --bg-panel: #0f0903;
            --bg-card: #1c1005;
            --bg-input: #291807;
            --text-main: #fefce8;
            --text-accent: #fbbf24;
            --accent-glow: #eab308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            transition: background 0.3s ease;
        }

        /* CRT Scanline Overlay */
        body.crt-enabled::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        /* Dynamic Electrified Glowing Rain & Lightning Canvas Background */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 10px var(--primary));
        }

        #app-container {
            width: 95vw;
            max-width: 1150px;
            height: 88vh;
            height: 88dvh;
            background: var(--bg-panel);
            border-radius: 12px;
            display: flex;
            overflow: hidden;
            z-index: 10;
            border: 2px solid var(--primary);
            box-shadow: 0 0 25px var(--primary), inset 0 0 25px var(--secondary-glow), 0 0 50px var(--secondary-glow);
            position: relative;
            transition: all 0.3s ease;
        }

        /* Account Auth & Popup Overlays */
        #auth-overlay, #invite-popup-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-base);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 16px;
        }

        #invite-popup-overlay {
            display: none;
            z-index: 300;
        }

        .auth-card, .popup-card {
            background: var(--bg-card);
            padding: 28px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 360px;
            border: 2px solid var(--secondary);
            box-shadow: 0 0 25px var(--secondary), inset 0 0 15px var(--primary-glow);
            text-align: center;
        }

        .auth-card h2, .popup-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--secondary);
        }

        .auth-card p, .popup-card p {
            font-size: 12px;
            color: var(--secondary);
        }

        .popup-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* Sidebar - Solid */
        #sidebar {
            width: 280px;
            background: var(--bg-panel);
            border-right: 2px solid var(--primary);
            box-shadow: 4px 0 15px var(--primary-glow);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            position: relative;
        }

        .sidebar-close-btn {
            display: none;
            position: absolute;
            top: 14px;
            right: 16px;
            font-size: 22px;
            color: var(--secondary);
            cursor: pointer;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 6px;
            background: var(--secondary-glow);
            border: 1px solid var(--secondary);
        }

        .sidebar-close-btn:hover {
            color: #ffffff;
            background: var(--secondary-glow);
            box-shadow: 0 0 8px var(--secondary);
        }

        .user-profile-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--primary-glow);
        }

        .user-profile-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .user-profile-box label {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--primary);
            text-transform: uppercase;
            text-shadow: 0 0 6px var(--primary);
        }

        .user-profile-box span.disp-name {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 8px var(--secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-profile-box span.usr-handle {
            font-size: 11px;
            color: var(--text-accent);
        }

        .status-badge-container {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-card);
            border: 1px solid var(--primary);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            color: var(--text-accent);
            cursor: pointer;
        }

        .room-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--primary-glow);
        }

        .sidebar-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
            text-shadow: 0 0 8px var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-friend-box {
            display: flex;
            gap: 6px;
        }

        .add-friend-box input, .auth-card input {
            padding: 10px 14px;
            font-size: 12px;
        }

        #friends-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        .friend-card {
            background: var(--bg-card);
            border: 1px solid var(--primary-glow);
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .friend-card:hover {
            border-color: var(--secondary);
            background: var(--bg-input);
            box-shadow: 0 0 10px var(--secondary-glow);
        }

        .friend-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4b5563;
            box-shadow: 0 0 4px rgba(75, 85, 99, 0.5);
            flex-shrink: 0;
        }

        .status-dot.online {
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
        }

        .friend-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .friend-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .friend-handle {
            font-size: 10px;
            color: var(--text-accent);
        }

        .friend-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-invite-friend {
            background: var(--bg-card);
            border: 1px solid var(--primary);
            color: var(--text-accent);
            padding: 4px 8px;
            font-size: 10px;
            border-radius: 6px;
        }

        .btn-invite-friend:hover {
            background: var(--bg-input);
            box-shadow: 0 0 8px var(--primary);
        }

        .remove-friend {
            color: var(--secondary);
            cursor: pointer;
            font-size: 14px;
            opacity: 0.7;
            padding: 4px;
        }

        .remove-friend:hover { opacity: 1; text-shadow: 0 0 6px var(--secondary); }

        /* Main Chat Area */
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
            background: var(--bg-panel);
        }

        #tabs-bar {
            background: var(--bg-panel);
            border-bottom: 2px solid var(--primary);
            display: flex;
            align-items: center;
            padding: 6px 12px 0 12px;
            gap: 6px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }

        #tabs-bar::-webkit-scrollbar {
            height: 3px;
        }

        #tabs-bar::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        #tabs-list {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-tab {
            background: var(--bg-card);
            border: 1px solid var(--primary-glow);
            border-bottom: none;
            padding: 6px 12px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            font-size: 12px;
            color: var(--secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
            max-width: 200px;
            transition: all 0.2s ease;
        }

        .chat-tab.active {
            background: var(--bg-panel);
            color: #fff;
            border-color: var(--primary);
            border-bottom: 1px solid var(--bg-panel);
            font-weight: 600;
            box-shadow: 0 -4px 15px var(--primary-glow);
        }

        .tab-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .edit-tab-btn {
            font-size: 10px;
            opacity: 0.6;
            cursor: pointer;
        }

        .edit-tab-btn:hover { opacity: 1; color: var(--primary); }

        .tab-close-btn {
            font-size: 12px;
            color: var(--secondary);
            opacity: 0.7;
            cursor: pointer;
        }

        .tab-close-btn:hover { opacity: 1; text-shadow: 0 0 6px var(--secondary); }

        .add-tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--primary);
            color: var(--text-accent);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 4px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .add-tab-btn:hover {
            background: var(--bg-input);
            box-shadow: 0 0 10px var(--primary);
        }

        #chat-header {
            padding: 12px 18px;
            background: var(--bg-panel);
            border-bottom: 2px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        #room-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px var(--primary-glow);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .inbox-btn, .menu-toggle-btn {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--primary);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 8px var(--primary-glow);
        }

        .menu-toggle-btn { display: none; }

        .green-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            width: 9px;
            height: 9px;
            background-color: var(--primary);
            border-radius: 50%;
            border: 2px solid var(--bg-panel);
            box-shadow: 0 0 8px var(--primary);
            display: none;
        }

        .green-badge.active { display: block; }

        .header-btn {
            background: var(--bg-card);
            border: 1px solid var(--primary);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            color: var(--text-accent);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            box-shadow: 0 0 8px var(--primary-glow);
        }

        .header-btn:hover {
            background: var(--bg-input);
            box-shadow: 0 0 12px var(--primary);
        }

        .btn-leave-room {
            background: var(--bg-card);
            border: 1px solid var(--secondary);
            color: var(--secondary);
            box-shadow: 0 0 8px var(--secondary-glow);
        }

        .btn-leave-room:hover {
            background: var(--bg-input);
            box-shadow: 0 0 12px var(--secondary);
        }

        .status {
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--bg-card);
            color: var(--secondary);
            border: 1px solid var(--secondary);
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 0 8px var(--secondary-glow);
        }

        .status.online {
            background: var(--bg-card);
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        #messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
            background: var(--bg-panel);
        }

        /* Solid message bubbles */
        .msg {
            background: var(--bg-card);
            border: 1px solid var(--primary);
            padding: 10px 14px;
            border-radius: 10px;
            border-top-left-radius: 2px;
            max-width: 80%;
            width: fit-content;
            word-break: break-word;
            font-size: 13px;
            line-height: 1.4;
            color: var(--text-main);
            box-shadow: 0 0 12px var(--primary-glow);
            position: relative;
        }

        .msg.self {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: 1px solid var(--text-accent);
            color: #ffffff;
            font-weight: 600;
            border-radius: 10px;
            border-top-right-radius: 2px;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .msg .sender-header {
            font-size: 11px;
            color: var(--text-accent);
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .msg.self .sender-header {
            color: rgba(255, 255, 255, 0.9);
            justify-content: flex-end;
        }

        /* Reactions Styling */
        .msg-reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }

        .reaction-pill {
            background: var(--bg-panel);
            border: 1px solid var(--primary-glow);
            border-radius: 12px;
            padding: 2px 6px;
            font-size: 10px;
            color: var(--text-accent);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .reaction-pill:hover {
            background: var(--bg-input);
            border-color: var(--secondary);
            color: #fff;
        }

        .add-reaction-btn {
            background: transparent;
            border: 1px dashed var(--primary-glow);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            color: var(--text-accent);
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-top: 6px;
            box-shadow: none;
            padding: 0;
        }

        .add-reaction-btn:hover {
            background: var(--bg-card);
            color: #fff;
            box-shadow: 0 0 6px var(--primary);
        }

        .reaction-picker {
            position: absolute;
            bottom: -32px;
            left: 0;
            background: var(--bg-card);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 4px 6px;
            display: none;
            gap: 6px;
            z-index: 50;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .reaction-picker.open { display: flex; }
        .reaction-option { cursor: pointer; font-size: 14px; transition: transform 0.1s; }
        .reaction-option:hover { transform: scale(1.25); }

        .user-eye {
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .user-eye.looking {
            color: var(--primary);
            filter: drop-shadow(0 0 6px var(--primary));
        }

        .user-eye.away {
            color: #6b7280;
            filter: grayscale(100%);
            opacity: 0.5;
        }

        #typing-indicator {
            font-size: 11px;
            color: var(--secondary);
            padding: 2px 16px;
            font-style: italic;
            height: 18px;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 6px var(--secondary-glow);
            background: var(--bg-panel);
        }

        #input-area {
            padding: 12px 16px;
            background: var(--bg-panel);
            display: flex;
            gap: 8px;
            border-top: 2px solid var(--primary);
            align-items: center;
        }

        input[type="text"], input[type="password"] {
            flex: 1;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--primary);
            background: var(--bg-input);
            color: #fff;
            outline: none;
            font-size: 13px;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 8px var(--primary-glow);
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 12px var(--secondary), inset 0 0 8px var(--secondary-glow);
        }

        button {
            padding: 10px 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: 1px solid var(--text-accent);
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            color: #ffffff;
            font-size: 12px;
            white-space: nowrap;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        button:hover {
            background: linear-gradient(135deg, var(--text-accent), var(--secondary));
            box-shadow: 0 0 20px var(--primary), 0 0 25px var(--secondary);
        }

        .btn-secondary {
            background: var(--bg-card);
            border: 1px solid var(--primary);
            color: var(--text-accent);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        .btn-secondary:hover {
            background: var(--bg-input);
            box-shadow: 0 0 12px var(--primary);
            color: #fff;
        }

        .glitch-btn {
            background: var(--bg-card);
            border: 1px solid var(--secondary);
            color: var(--secondary);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 8px var(--secondary-glow);
        }
        .glitch-btn:hover {
            background: var(--bg-input);
            box-shadow: 0 0 12px var(--secondary);
            color: #fff;
        }

        #inbox-modal {
            display: none;
            position: absolute;
            top: 55px;
            right: 12px;
            width: calc(100% - 24px);
            max-width: 320px;
            background: var(--bg-card);
            border: 2px solid var(--primary);
            border-radius: 12px;
            box-shadow: 0 0 25px var(--primary), inset 0 0 15px var(--secondary-glow);
            padding: 14px;
            z-index: 100;
            flex-direction: column;
            gap: 10px;
        }

        .inbox-tabs {
            display: flex;
            gap: 6px;
            border-bottom: 1px solid var(--primary-glow);
            padding-bottom: 6px;
        }

        .inbox-tab {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-accent);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .inbox-tab.active {
            color: #ffffff;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            font-weight: 700;
        }

        .req-card {
            background: var(--bg-panel);
            border: 1px solid var(--primary-glow);
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .req-actions { display: flex; gap: 4px; }
        .req-actions button { padding: 4px 8px; font-size: 10px; border-radius: 6px; }
        .btn-accept { background: var(--primary); color: var(--bg-base); border: none; box-shadow: 0 0 8px var(--primary-glow); font-weight: 700; }
        .btn-accept:hover { box-shadow: 0 0 12px var(--primary); }
        .btn-decline { background: var(--bg-card); color: var(--secondary); border: 1px solid var(--secondary); }

        /* Settings Modal & Deck Utilities */
        .deck-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 10px;
            border-top: 1px solid var(--primary-glow);
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-accent);
        }

        .setting-row select {
            background: var(--bg-input);
            color: #fff;
            border: 1px solid var(--primary);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            outline: none;
        }

        /* Drawing panel styles */
        #draw-panel {
            position: absolute;
            z-index: 400;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 760px;
            max-width: calc(100% - 32px);
            height: 480px;
            background: var(--bg-card);
            border: 2px solid var(--primary);
            border-radius: 12px;
            box-shadow: 0 0 30px var(--primary), inset 0 0 20px var(--secondary-glow);
            display: none;
            flex-direction: column;
            padding: 10px;
        }

        #draw-toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 6px;
            border-bottom: 1px solid var(--primary-glow);
        }

        #draw-toolbar > * { font-size: 13px; }

        #draw-canvas {
            flex: 1;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.02));
            touch-action: none;
            cursor: crosshair;
        }

        .draw-btn {
            padding: 8px 10px;
            border-radius: 8px;
            background: var(--bg-panel);
            color: var(--text-accent);
            border: 1px solid var(--primary);
            cursor: pointer;
        }
        .draw-btn:hover { box-shadow: 0 0 10px var(--primary); color: #fff; }

        .draw-actions { margin-left: auto; display:flex; gap:8px; }

        /* responsive */
        @media (max-width: 768px) {
            body { padding: 0; }
            #app-container {
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                border-radius: 0;
                border: none;
                flex-direction: column;
            }
            .menu-toggle-btn { display: flex; }
            .sidebar-close-btn { display: block; }
            #sidebar {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 90;
                background: var(--bg-panel);
                transform: translateX(-100%);
                padding-top: 50px;
            }
            #sidebar.open { transform: translateX(0); }
            .status { display: none; }
            #chat-header { height: 50px; }
            #draw-panel { width: calc(100% - 24px); height: 60vh; }
        }
    </style>
</head>
<body class="theme-matrix crt-enabled">

    <canvas id="bg-canvas"></canvas>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>CYBERNET LOGIN</h2>
            <p id="auth-subtext">Enter your link credentials. Use exact password for multi-device sync!</p>
            <input type="text" id="auth-displayname" placeholder="Display Name (e.g. Neo)" maxlength="15" autocomplete="off">
            <input type="text" id="auth-username" placeholder="@USER (e.g. glitch_99)" maxlength="15" autocapitalize="none" autocomplete="off">
            <input type="password" id="auth-pass" placeholder="Secure Password" maxlength="20">
            <button type="button" id="auth-btn" onclick="handleAuth()">Initialize Connection</button>
        </div>
    </div>

    <div id="invite-popup-overlay">
        <div class="popup-card">
            <h2>ROOM INVITE</h2>
            <p id="popup-invite-text">Your connection invited you to join a secure channel.</p>
            <div class="popup-actions">
                <button type="button" onclick="acceptRoomInvite()">Accept Link</button>
                <button type="button" class="btn-secondary" onclick="declineRoomInvite()">Decline</button>
            </div>
        </div>
    </div>

    <div id="app-container">
        <div id="sidebar">
            <span class="sidebar-close-btn" onclick="toggleSidebar()" title="Close Menu">&times;</span>

            <div class="user-profile-box">
                <div class="user-profile-info">
                    <label>Terminal User</label>
                    <span id="display-user" class="disp-name">--</span>
                    <span id="display-handle" class="usr-handle">--</span>
                </div>
                <button type="button" class="btn-secondary" style="padding:4px 8px; font-size:10px;" onclick="switchAccount()">Switch</button>
            </div>

            <div class="status-badge-container" onclick="promptCustomStatus()" title="Set Status Mood">
                <span>🟢</span>
                <span id="user-status-mood" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">⚡ Jacked In</span>
            </div>

            <!-- ... rest of sidebar (friends list, actions...) unchanged ... -->
        </div>

        <div id="chat-container">
            <div id="tabs-bar">
                <div id="tabs-list">
                    <div class="chat-tab active"><span class="tab-title">General</span></div>
                </div>
                <div style="flex:1"></div>
            </div>

            <div id="chat-header">
                <div id="room-display">Neon Lounge</div>
                <div class="header-actions">
                    <button class="inbox-btn" id="inbox-toggle" onclick="toggleInbox()">Inbox <span class="green-badge" id="inbox-badge"></span></button>
                    <button class="header-btn btn-leave-room" onclick="leaveRoom()">Leave</button>
                </div>
            </div>

            <div id="messages" aria-live="polite">
                <!-- messages appear here -->
            </div>

            <div id="typing-indicator"></div>

            <div id="input-area">
                <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off">
                <button id="send-btn" onclick="sendMessage()">Send</button>
                <button id="draw-toggle-btn" class="btn-secondary" type="button" onclick="toggleDrawPanel()">Draw</button>
            </div>
        </div>

        <!-- Drawing panel (overlay) -->
        <div id="draw-panel" role="dialog" aria-modal="true" aria-hidden="true">
            <div id="draw-toolbar">
                <button class="draw-btn" onclick="setTool('pen')">Pen</button>
                <button class="draw-btn" onclick="setTool('eraser')">Eraser</button>
                <label style="display:flex;align-items:center;gap:6px;">
                    Color
                    <input id="draw-color" type="color" value="#00ffcc" title="Brush color">
                </label>
                <label style="display:flex;align-items:center;gap:6px;">
                    Size
                    <input id="draw-size" type="range" min="1" max="60" value="6">
                </label>

                <div class="draw-actions">
                    <button class="draw-btn" onclick="clearDrawing()">Clear</button>
                    <button class="draw-btn" onclick="closeDrawPanel()">Close</button>
                    <button class="draw-btn" onclick="sendDrawing()">Send</button>
                </div>
            </div>
            <canvas id="draw-canvas"></canvas>
        </div>
    </div>

    <script>
        /* Basic stubs so the UI doesn't break and to support the drawing feature.
           This script:
             - provides a simple auth handler (hides auth overlay),
             - implements an in-browser drawing UI and sendDrawing() which appends the drawn image into the chat,
             - if PubNub is initialized elsewhere as `pubnub` and a channel is set on window.chatChannel, drawing will be published as a message payload.
        */

        // --- Simple auth / small helpers (non-intrusive) ---
        function handleAuth() {
            const display = document.getElementById('auth-displayname').value.trim() || 'Anon';
            const handle = document.getElementById('auth-username').value.trim() || '@anon';
            window.displayName = display;
            window.userHandle = handle.startsWith('@') ? handle : ('@' + handle);
            document.getElementById('display-user').textContent = window.displayName;
            document.getElementById('display-handle').textContent = window.userHandle;
            // hide overlay
            const overlay = document.getElementById('auth-overlay');
            overlay.style.display = 'none';
            // default chat channel for demo (app can override)
            if (!window.chatChannel) window.chatChannel = 'cyberchat-demo';
            // if there is a PubNub instance created elsewhere (optional), subscribe listeners here
            if (window.pubnub && typeof window.pubnub.addListener === 'function') {
                try {
                    window.pubnub.addListener({
                        message: function(envelope) {
                            const m = envelope.message;
                            if (m && m.type === 'image') {
                                renderIncomingImage(m);
                            } else if (m && m.type === 'text') {
                                renderIncomingText(m);
                            }
                        }
                    });
                    window.pubnub.subscribe({ channels: [window.chatChannel] });
                } catch (e) { console.debug('PubNub not initialized here.'); }
            }
        }

        function toggleInbox() {
            const el = document.getElementById('inbox-modal');
            if (!el) return;
            el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
        }
        function leaveRoom() { alert('Leaving (demo)'); }
        function acceptRoomInvite() { document.getElementById('invite-popup-overlay').style.display='none'; }
        function declineRoomInvite() { document.getElementById('invite-popup-overlay').style.display='none'; }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function switchAccount(){ alert('Switch account (not implemented in demo)'); }
        function promptCustomStatus(){ alert('Set status (demo)'); }

        function renderIncomingText(m) {
            const messages = document.getElementById('messages');
            const el = document.createElement('div');
            el.className = 'msg';
            el.innerHTML = '<div class="sender-header">' + (m.author || 'Friend') + '</div>' +
                           '<div>' + (m.text || '') + '</div>';
            messages.appendChild(el);
            messages.scrollTop = messages.scrollHeight;
        }

        function renderIncomingImage(m) {
            const messages = document.getElementById('messages');
            const el = document.createElement('div');
            el.className = 'msg';
            el.innerHTML = '<div class="sender-header">' + (m.author || 'Friend') + '</div>';
            const img = document.createElement('img');
            img.src = m.image;
            img.style.maxWidth = '320px';
            img.style.borderRadius = '8px';
            img.style.display = 'block';
            img.style.marginTop = '6px';
            el.appendChild(img);
            messages.appendChild(el);
            messages.scrollTop = messages.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = (input.value || '').trim();
            if (!text) return;
            const payload = { type: 'text', author: window.displayName || 'You', text };
            appendLocalText(payload);
            // publish via pubnub if present
            if (window.pubnub && window.chatChannel) {
                try {
                    window.pubnub.publish({ channel: window.chatChannel, message: payload });
                } catch (e) { console.warn('Publish failed', e); }
            }
            input.value = '';
        }

        function appendLocalText(payload){
            const messages = document.getElementById('messages');
            const el = document.createElement('div');
            el.className = 'msg self';
            el.innerHTML = '<div class="sender-header">You</div>' +
                           '<div>' + (payload.text || '') + '</div>';
            messages.appendChild(el);
            messages.scrollTop = messages.scrollHeight;
        }

        // --- Drawing panel implementation ---
        const drawPanel = document.getElementById('draw-panel');
        const drawCanvas = document.getElementById('draw-canvas');
        const colorInput = document.getElementById('draw-color');
        const sizeInput = document.getElementById('draw-size');

        let dctx, dpr = window.devicePixelRatio || 1;
        let drawing = false;
        let lastX = 0, lastY = 0;
        let tool = 'pen';
        let paths = []; // history for undo (not exposed in UI but useful)

        function resizeDrawCanvas() {
            if (!drawCanvas) return;
            const rect = drawCanvas.getBoundingClientRect();
            const w = Math.max(1, Math.floor(rect.width));
            const h = Math.max(1, Math.floor(rect.height));
            drawCanvas.width = Math.floor(w * dpr);
            drawCanvas.height = Math.floor(h * dpr);
            drawCanvas.style.width = w + 'px';
            drawCanvas.style.height = h + 'px';
            dctx = drawCanvas.getContext('2d');
            dctx.scale(dpr, dpr);
            // initialize background transparent
            dctx.lineCap = 'round';
            dctx.lineJoin = 'round';
            redrawAll();
        }

        function setTool(t){
            tool = t;
            if (t === 'eraser') {
                drawCanvas.style.cursor = 'cell';
            } else {
                drawCanvas.style.cursor = 'crosshair';
            }
        }

        function openDrawPanel() {
            drawPanel.style.display = 'flex';
            drawPanel.setAttribute('aria-hidden','false');
            setTimeout(resizeDrawCanvas, 60);
        }
        function closeDrawPanel() {
            drawPanel.style.display = 'none';
            drawPanel.setAttribute('aria-hidden','true');
        }
        function toggleDrawPanel() {
            if (drawPanel.style.display === 'flex') closeDrawPanel();
            else openDrawPanel();
        }

        function clearDrawing() {
            if (!dctx) return;
            dctx.clearRect(0,0,drawCanvas.width/dpr,drawCanvas.height/dpr);
            paths = [];
        }

        // Record strokes as arrays to allow redrawing if we resize
        function redrawAll(){
            if (!dctx) return;
            dctx.clearRect(0,0,drawCanvas.width/dpr,drawCanvas.height/dpr);
            for (const p of paths){
                dctx.strokeStyle = p.tool === 'eraser' ? 'rgba(0,0,0,0)' : p.color;
                dctx.globalCompositeOperation = p.tool === 'eraser' ? 'destination-out' : 'source-over';
                dctx.lineWidth = p.size;
                dctx.beginPath();
                for (let i=0;i<p.points.length;i++){
                    const pt = p.points[i];
                    if (i===0) dctx.moveTo(pt.x, pt.y);
                    else dctx.lineTo(pt.x, pt.y);
                }
                dctx.stroke();
            }
            dctx.globalCompositeOperation = 'source-over';
        }

        function pointerDown(e){
            e.preventDefault();
            drawing = true;
            const pos = getPointerPos(e);
            lastX = pos.x; lastY = pos.y;
            const newPath = { tool: tool, color: colorInput.value, size: Number(sizeInput.value), points: [{x: lastX, y: lastY}] };
            paths.push(newPath);
        }

        function pointerMove(e){
            if (!drawing) return;
            e.preventDefault();
            const pos = getPointerPos(e);
            const curPath = paths[paths.length-1];
            curPath.points.push({x: pos.x, y: pos.y});
            // draw incrementally
            dctx.strokeStyle = curPath.tool === 'eraser' ? 'rgba(0,0,0,0)' : curPath.color;
            dctx.globalCompositeOperation = curPath.tool === 'eraser' ? 'destination-out' : 'source-over';
            dctx.lineWidth = curPath.size;
            dctx.beginPath();
            dctx.moveTo(lastX, lastY);
            dctx.lineTo(pos.x, pos.y);
            dctx.stroke();
            lastX = pos.x; lastY = pos.y;
            dctx.globalCompositeOperation = 'source-over';
        }

        function pointerUp(e){
            drawing = false;
        }

        function getPointerPos(e){
            const rect = drawCanvas.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches && e.touches.length) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return { x: (clientX - rect.left), y: (clientY - rect.top) };
        }

        function attachDrawEvents(){
            if (!drawCanvas) return;
            drawCanvas.addEventListener('pointerdown', pointerDown);
            window.addEventListener('pointermove', pointerMove);
            window.addEventListener('pointerup', pointerUp);
            // touch fallback
            drawCanvas.addEventListener('touchstart', pointerDown, {passive:false});
            window.addEventListener('touchmove', pointerMove, {passive:false});
            window.addEventListener('touchend', pointerUp);
            // resize
            new ResizeObserver(resizeDrawCanvas).observe(drawCanvas.parentElement);
            resizeDrawCanvas();
        }

        // Send drawing to chat (local append + optional PubNub publish)
        function sendDrawing(){
            // convert to data URL
            // create a temp canvas to export at reasonable size
            const exportCanvas = document.createElement('canvas');
            const w = drawCanvas.width / dpr;
            const h = drawCanvas.height / dpr;
            exportCanvas.width = w;
            exportCanvas.height = h;
            const exCtx = exportCanvas.getContext('2d');
            // copy current visual content
            exCtx.drawImage(drawCanvas, 0, 0, w, h);
            const dataURL = exportCanvas.toDataURL('image/png');

            // append locally
            const messages = document.getElementById('messages');
            const el = document.createElement('div');
            el.className = 'msg self';
            el.innerHTML = '<div class="sender-header">You</div>';
            const img = document.createElement('img');
            img.src = dataURL;
            img.style.maxWidth = '320px';
            img.style.borderRadius = '8px';
            img.style.display = 'block';
            img.style.marginTop = '6px';
            el.appendChild(img);
            messages.appendChild(el);
            messages.scrollTop = messages.scrollHeight;

            // publish via PubNub if available and configured
            if (window.pubnub && window.chatChannel) {
                try {
                    const payload = { type: 'image', author: window.displayName || 'You', image: dataURL };
                    window.pubnub.publish({ channel: window.chatChannel, message: payload });
                } catch (e) {
                    console.warn('PubNub publish failed:', e);
                }
            }

            // optionally close panel after sending
            closeDrawPanel();
        }

        // initialize drawing events on DOMContentLoaded
        document.addEventListener('DOMContentLoaded', function(){
            attachDrawEvents();
            // preserve ability to open after load
            // if there is a draw toggle button, wire Enter key / accessibility
            const dt = document.getElementById('draw-toggle-btn');
            if (dt) dt.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') toggleDrawPanel(); });
        });

        // make sure drawing panel hides on Escape
        window.addEventListener('keydown', function(e){
            if (e.key === 'Escape') {
                if (drawPanel.style.display === 'flex') closeDrawPanel();
            }
        });

        // Make sure messages area autosizes and focus management works
        const messageInput = document.getElementById('message-input');
        messageInput && messageInput.addEventListener('keydown', function(e){
            if (e.key === 'Enter') sendMessage();
        });

        // Basic small helper exposed for debugging
        window.openDrawPanel = openDrawPanel;
        window.closeDrawPanel = closeDrawPanel;
        window.sendDrawing = sendDrawing;
        window.clearDrawing = clearDrawing;
        window.setTool = setTool;
    </script>
</body>
</html>
