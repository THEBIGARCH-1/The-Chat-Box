<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberChat // Retro-Futuristic Terminal</title>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #04020a;
            color: #f3f4f6;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Dynamic Electrified Glowing Rain & Lightning Canvas Background */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 8px #3b82f6);
        }

        #app-container {
            width: 95vw;
            max-width: 1150px;
            height: 88vh;
            height: 88dvh;
            background: rgba(10, 8, 24, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 12px;
            display: flex;
            overflow: hidden;
            z-index: 10;
            /* Cyberpunk Blue and Purple Gradient Neon Borders */
            border: 2px solid #3b82f6;
            box-shadow: 0 0 25px #3b82f6, inset 0 0 25px rgba(168, 85, 247, 0.3), 0 0 50px rgba(168, 85, 247, 0.2);
            position: relative;
        }

        /* Account Auth & Popup Overlays */
        #auth-overlay, #invite-popup-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 2, 10, 0.92);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 16px;
        }

        #invite-popup-overlay {
            display: none;
            z-index: 300;
        }

        .auth-card, .popup-card {
            background: rgba(15, 12, 32, 0.98);
            padding: 28px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 360px;
            border: 2px solid #a855f7;
            box-shadow: 0 0 25px #a855f7, inset 0 0 15px rgba(59, 130, 246, 0.3);
            text-align: center;
        }

        .auth-card h2, .popup-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 10px #3b82f6, 0 0 20px #a855f7;
        }

        .auth-card p, .popup-card p {
            font-size: 12px;
            color: #c084fc;
        }

        .popup-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* Sidebar */
        #sidebar {
            width: 280px;
            background: rgba(7, 5, 18, 0.95);
            border-right: 2px solid #3b82f6;
            box-shadow: 4px 0 15px rgba(59, 130, 246, 0.2);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            position: relative;
        }

        .sidebar-close-btn {
            display: none;
            position: absolute;
            top: 14px;
            right: 16px;
            font-size: 22px;
            color: #c084fc;
            cursor: pointer;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid #a855f7;
        }

        .sidebar-close-btn:hover {
            color: #ffffff;
            background: rgba(168, 85, 247, 0.25);
            box-shadow: 0 0 8px #a855f7;
        }

        .user-profile-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.4);
        }

        .user-profile-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .user-profile-box label {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #3b82f6;
            text-transform: uppercase;
            text-shadow: 0 0 6px #3b82f6;
        }

        .user-profile-box span.disp-name {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 8px #a855f7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-profile-box span.usr-handle {
            font-size: 11px;
            color: #60a5fa;
        }

        .room-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.4);
        }

        .sidebar-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
            text-shadow: 0 0 8px #3b82f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-friend-box {
            display: flex;
            gap: 6px;
        }

        .add-friend-box input, .auth-card input {
            padding: 10px 14px;
            font-size: 12px;
        }

        #friends-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: #3b82f6 transparent;
        }

        .friend-card {
            background: rgba(59, 130, 246, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .friend-card:hover {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.08);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }

        .friend-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4b5563;
            box-shadow: 0 0 4px rgba(75, 85, 99, 0.5);
            flex-shrink: 0;
        }

        .status-dot.online {
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
        }

        .friend-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .friend-name {
            font-size: 13px;
            font-weight: 600;
            color: #f3f4f6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .friend-handle {
            font-size: 10px;
            color: #60a5fa;
        }

        .friend-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-invite-friend {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid #3b82f6;
            color: #60a5fa;
            padding: 4px 8px;
            font-size: 10px;
            border-radius: 6px;
        }

        .btn-invite-friend:hover {
            background: rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 8px #3b82f6;
        }

        .remove-friend {
            color: #a855f7;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.7;
            padding: 4px;
        }

        .remove-friend:hover { opacity: 1; text-shadow: 0 0 6px #a855f7; }

        /* Main Chat Area */
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
        }

        #tabs-bar {
            background: rgba(6, 4, 15, 0.95);
            border-bottom: 2px solid #3b82f6;
            display: flex;
            align-items: center;
            padding: 6px 12px 0 12px;
            gap: 6px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }

        #tabs-bar::-webkit-scrollbar {
            height: 3px;
        }

        #tabs-bar::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 4px;
        }

        #tabs-list {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-tab {
            background: rgba(59, 130, 246, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-bottom: none;
            padding: 6px 12px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            font-size: 12px;
            color: #c084fc;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
            max-width: 200px;
            transition: all 0.2s ease;
        }

        .chat-tab.active {
            background: rgba(15, 12, 32, 0.98);
            color: #fff;
            border-color: #3b82f6;
            border-bottom: 1px solid rgba(15, 12, 32, 0.98);
            font-weight: 600;
            box-shadow: 0 -4px 15px rgba(59, 130, 246, 0.4);
        }

        .tab-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .edit-tab-btn {
            font-size: 10px;
            opacity: 0.6;
            cursor: pointer;
        }

        .edit-tab-btn:hover { opacity: 1; color: #3b82f6; }

        .tab-close-btn {
            font-size: 12px;
            color: #a855f7;
            opacity: 0.7;
            cursor: pointer;
        }

        .tab-close-btn:hover { opacity: 1; text-shadow: 0 0 6px #a855f7; }

        .add-tab-btn {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid #3b82f6;
            color: #60a5fa;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 4px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .add-tab-btn:hover {
            background: rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 10px #3b82f6;
        }

        #chat-header {
            padding: 12px 18px;
            background: rgba(7, 5, 18, 0.9);
            border-bottom: 2px solid #3b82f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        #room-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .inbox-btn, .menu-toggle-btn {
            position: relative;
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid #3b82f6;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #60a5fa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.2);
        }

        .menu-toggle-btn { display: none; }

        .green-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            width: 9px;
            height: 9px;
            background-color: #00ffcc;
            border-radius: 50%;
            border: 2px solid #070512;
            box-shadow: 0 0 8px #00ffcc;
            display: none;
        }

        .green-badge.active { display: block; }

        .header-btn {
            background: rgba(59, 130, 246, 0.08);
            border: 1px solid #3b82f6;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            color: #60a5fa;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.2);
        }

        .header-btn:hover {
            background: rgba(59, 130, 246, 0.25);
            box-shadow: 0 0 12px #3b82f6;
        }

        .btn-leave-room {
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid #a855f7;
            color: #c084fc;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.2);
        }

        .btn-leave-room:hover {
            background: rgba(168, 85, 247, 0.25);
            box-shadow: 0 0 12px #a855f7;
        }

        .status {
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(168, 85, 247, 0.12);
            color: #c084fc;
            border: 1px solid #a855f7;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.3);
        }

        .status.online {
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        #messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: thin;
            scrollbar-color: #3b82f6 transparent;
        }

        .msg {
            background: rgba(18, 14, 38, 0.85);
            border: 1px solid #3b82f6;
            padding: 10px 14px;
            border-radius: 10px;
            border-top-left-radius: 2px;
            max-width: 80%;
            width: fit-content;
            word-break: break-word;
            font-size: 13px;
            line-height: 1.4;
            color: #f3f4f6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.25);
            position: relative;
        }

        .msg.self {
            align-self: flex-end;
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            border: 1px solid #60a5fa;
            color: #ffffff;
            font-weight: 600;
            border-radius: 10px;
            border-top-right-radius: 2px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        .msg .sender-header {
            font-size: 11px;
            color: #60a5fa;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .msg.self .sender-header {
            color: rgba(255, 255, 255, 0.9);
            justify-content: flex-end;
        }

        /* Reactions Styling */
        .msg-reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }

        .reaction-pill {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 12px;
            padding: 2px 6px;
            font-size: 10px;
            color: #60a5fa;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .reaction-pill:hover {
            background: rgba(168, 85, 247, 0.3);
            border-color: #a855f7;
            color: #fff;
        }

        .add-reaction-btn {
            background: transparent;
            border: 1px dashed rgba(59, 130, 246, 0.5);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            color: #60a5fa;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-top: 6px;
            box-shadow: none;
            padding: 0;
        }

        .add-reaction-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            color: #fff;
            box-shadow: 0 0 6px #3b82f6;
        }

        .reaction-picker {
            position: absolute;
            bottom: -32px;
            left: 0;
            background: rgba(12, 8, 25, 0.98);
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 4px 6px;
            display: none;
            gap: 6px;
            z-index: 50;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        .reaction-picker.open { display: flex; }
        .reaction-option { cursor: pointer; font-size: 14px; transition: transform 0.1s; }
        .reaction-option:hover { transform: scale(1.25); }

        .user-eye {
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .user-eye.looking {
            color: #00ffcc;
            filter: drop-shadow(0 0 6px #00ffcc);
        }

        .user-eye.away {
            color: #6b7280;
            filter: grayscale(100%);
            opacity: 0.5;
        }

        #typing-indicator {
            font-size: 11px;
            color: #c084fc;
            padding: 2px 16px;
            font-style: italic;
            height: 18px;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 6px rgba(168, 85, 247, 0.4);
        }

        #input-area {
            padding: 12px 16px;
            background: rgba(7, 5, 18, 0.9);
            display: flex;
            gap: 8px;
            border-top: 2px solid #3b82f6;
        }

        input[type="text"], input[type="password"] {
            flex: 1;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #3b82f6;
            background: rgba(12, 8, 25, 0.95);
            color: #fff;
            outline: none;
            font-size: 13px;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 8px rgba(59, 130, 246, 0.2);
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #a855f7;
            box-shadow: 0 0 12px #a855f7, inset 0 0 8px rgba(168, 85, 247, 0.4);
        }

        button {
            padding: 10px 16px;
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            border: 1px solid #60a5fa;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            color: #ffffff;
            font-size: 12px;
            white-space: nowrap;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        button:hover {
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            box-shadow: 0 0 20px #3b82f6, 0 0 25px #a855f7;
        }

        .btn-secondary {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid #3b82f6;
            color: #60a5fa;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(59, 130, 246, 0.25);
            box-shadow: 0 0 12px #3b82f6;
            color: #fff;
        }

        #inbox-modal {
            display: none;
            position: absolute;
            top: 55px;
            right: 12px;
            width: calc(100% - 24px);
            max-width: 320px;
            background: rgba(12, 8, 25, 0.98);
            backdrop-filter: blur(20px);
            border: 2px solid #3b82f6;
            border-radius: 12px;
            box-shadow: 0 0 25px #3b82f6, inset 0 0 15px rgba(168, 85, 247, 0.3);
            padding: 14px;
            z-index: 100;
            flex-direction: column;
            gap: 10px;
        }

        .inbox-tabs {
            display: flex;
            gap: 6px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.4);
            padding-bottom: 6px;
        }

        .inbox-tab {
            font-size: 11px;
            font-weight: 600;
            color: #60a5fa;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .inbox-tab.active {
            color: #ffffff;
            background: #3b82f6;
            box-shadow: 0 0 10px #3b82f6;
            font-weight: 700;
        }

        .req-card {
            background: rgba(59, 130, 246, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .req-actions { display: flex; gap: 4px; }
        .req-actions button { padding: 4px 8px; font-size: 10px; border-radius: 6px; }
        .btn-accept { background: #00ffcc; color: #04020a; border: none; box-shadow: 0 0 8px rgba(0,255,204,0.5); font-weight: 700; }
        .btn-accept:hover { background: #33ffdb; box-shadow: 0 0 12px #00ffcc; }
        .btn-decline { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid #a855f7; }

        @media (max-width: 768px) {
            body { padding: 0; }
            #app-container { 
                width: 100vw; 
                height: 100vh; 
                height: 100dvh; 
                border-radius: 0; 
                border: none;
                flex-direction: column; 
            }
            .menu-toggle-btn { display: flex; }
            .sidebar-close-btn { display: block; }
            #sidebar { 
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 90;
                background: rgba(7, 5, 18, 0.98);
                backdrop-filter: blur(25px);
                transform: translateX(-100%);
                padding-top: 50px;
            }
            #sidebar.open { transform: translateX(0); }
            .status { display: none; }
            #chat-header { height: 50px; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>CYBERNET LOGIN</h2>
            <p id="auth-subtext">Enter your link credentials. Use exact password for multi-device sync!</p>
            <input type="text" id="auth-displayname" placeholder="Display Name (e.g. Neo)" maxlength="15" autocomplete="off">
            <input type="text" id="auth-username" placeholder="@USER (e.g. glitch_99)" maxlength="15" autocapitalize="none" autocomplete="off">
            <input type="password" id="auth-pass" placeholder="Secure Password" maxlength="20">
            <button type="button" id="auth-btn" onclick="handleAuth()">Initialize Connection</button>
        </div>
    </div>

    <div id="invite-popup-overlay">
        <div class="popup-card">
            <h2>ROOM INVITE</h2>
            <p id="popup-invite-text">Your connection invited you to join a secure channel.</p>
            <div class="popup-actions">
                <button type="button" onclick="acceptRoomInvite()">Accept Link</button>
                <button type="button" class="btn-secondary" onclick="declineRoomInvite()">Decline</button>
            </div>
        </div>
    </div>

    <div id="app-container">
        <div id="sidebar">
            <span class="sidebar-close-btn" onclick="toggleSidebar()" title="Close Menu">&times;</span>

            <div class="user-profile-box">
                <div class="user-profile-info">
                    <label>Terminal User</label>
                    <span id="display-user" class="disp-name">--</span>
                    <span id="display-handle" class="usr-handle">--</span>
                </div>
                <button type="button" class="btn-secondary" style="padding:4px 8px; font-size:10px;" onclick="switchAccount()">Switch</button>
            </div>

            <div class="room-actions">
                <button type="button" onclick="promptJoinRoom()">// Create / Join Channel</button>
            </div>

            <div class="sidebar-title">
                <span>Linked Contacts</span>
            </div>
            <div class="add-friend-box">
                <input type="text" id="friend-input" placeholder="@USER" autocapitalize="none" autocomplete="off">
                <button type="button" class="btn-secondary" onclick="sendFriendRequest()">Link</button>
            </div>
            <div id="friends-list"></div>
        </div>

        <div id="chat-container">
            <div id="tabs-bar">
                <div id="tabs-list"></div>
                <div class="add-tab-btn" onclick="promptJoinRoom()" title="Open New Channel">+</div>
            </div>

            <div id="chat-header">
                <button type="button" class="menu-toggle-btn" onclick="toggleSidebar()" title="Toggle Menu">⚡</button>
                <span id="room-display">Channel: Offline</span>
                
                <div class="header-actions">
                    <button type="button" class="inbox-btn" onclick="toggleInbox()" title="Inbox / Notifications">
                        📬
                        <span id="mail-badge" class="green-badge"></span>
                    </button>

                    <button type="button" class="header-btn btn-leave-room" onclick="leaveCurrentRoom()">Disconnect</button>
                    <button type="button" class="header-btn" onclick="inviteFriend()">Share Link</button>
                    <span id="status-badge" class="status">Offline</span>
                </div>
            </div>

            <div id="messages"></div>
            <div id="typing-indicator"></div>

            <div id="input-area">
                <input type="text" id="message-input" placeholder="Transmit message..." autocomplete="off" oninput="handleTypingInput()" onkeypress="if(event.key==='Enter') send()">
                <button type="button" onclick="send()">Send</button>
            </div>
        </div>

        <div id="inbox-modal">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="font-family:'Orbitron',sans-serif; font-size:12px; color:#60a5fa;">Incoming Signals</h3>
                <span style="cursor:pointer; font-weight:bold; color:#a855f7;" onclick="toggleInbox()">&times;</span>
            </div>
            
            <div class="inbox-tabs">
                <div id="tab-requests" class="inbox-tab active" onclick="switchInboxTab('requests')">Link Requests</div>
                <div id="tab-system" class="inbox-tab" onclick="switchInboxTab('system')">System Logs</div>
            </div>

            <div id="inbox-content" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>
    </div>

    <script>
        let pubnub = null;
        let authPubNub = null;
        let myName = "";        
        let myUsername = "";    
        let userChannel = "";
        let activeRoomCode = "";
        let pendingInviteRoomCode = "";
        let openRooms = [];
        let roomAliases = {};
        let roomMessages = {};  
        let userFocusStates = {}; 
        let friends = [];
        let incomingRequests = [];
        let systemMessages = [];
        let activeUsers = new Set();
        let currentTab = 'requests';
        let isUserLooking = true;
        let typingTimeout = null;
        let isCurrentlyTyping = false;
        let activeTypers = {};
        
        const myId = "usr_" + Math.random().toString(36).substr(2, 9);
        const GLOBAL_REGISTRY_CHANNEL = "global_user_registry_sync";

        // Web Audio API Sound Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSciFiSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'send') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'receive') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(440, now + 0.12);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'click') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                osc.start(now);
                osc.stop(now + 0.04);
            }
        }

        // Enlarged & Electrified Glowing Raindrops & Lightning Canvas Effect
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let drops = [];
        let lightningAlpha = 0;
        let lightningPath = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Fewer, much larger and heavily electrified rain particles
        for (let i = 0; i < 50; i++) {
            drops.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 60 + 40, // Larger length
                speed: Math.random() * 12 + 10,   // Faster, heavier drop speed
                opacity: Math.random() * 0.5 + 0.5
            });
        }

        function triggerLightningBolt() {
            lightningAlpha = 1.0;
            lightningPath = [];
            let currX = Math.random() * canvas.width;
            let currY = 0;
            lightningPath.push({x: currX, y: currY});

            while (currY < canvas.height) {
                currX += (Math.random() - 0.5) * 80;
                currY += Math.random() * 50 + 25;
                lightningPath.push({x: currX, y: currY});
            }

            setTimeout(triggerLightningBolt, Math.random() * 5000 + 3000);
        }
        setTimeout(triggerLightningBolt, 2000);

        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw massive electrified glowing raindrops
            ctx.lineWidth = 3.5; // Thicker, more prominent water streaks
            drops.forEach(d => {
                let grad = ctx.createLinearGradient(d.x, d.y, d.x, d.y + d.length);
                grad.addColorStop(0, `rgba(255, 255, 255, ${d.opacity})`); // Electrified white-hot core tip
                grad.addColorStop(0.3, `rgba(59, 130, 246, ${d.opacity})`); // Neon electric blue body
                grad.addColorStop(1, `rgba(168, 85, 247, 0)`); // Purple plasma tail fadeout
                ctx.strokeStyle = grad;

                ctx.beginPath();
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x, d.y + d.length);
                ctx.stroke();

                d.y += d.speed;
                if (d.y > canvas.height) {
                    d.y = -d.length;
                    d.x = Math.random() * canvas.width;
                }
            });

            // Draw intense glowing lightning strikes
            if (lightningAlpha > 0) {
                ctx.strokeStyle = `rgba(220, 240, 255, ${lightningAlpha})`;
                ctx.fillStyle = `rgba(59, 130, 246, ${lightningAlpha * 0.12})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.lineWidth = 5;
                ctx.beginPath();
                if (lightningPath.length > 0) {
                    ctx.moveTo(lightningPath[0].x, lightningPath[0].y);
                    for (let i = 1; i < lightningPath.length; i++) {
                        ctx.lineTo(lightningPath[i].x, lightningPath[i].y);
                    }
                }
                ctx.stroke();
                lightningAlpha -= 0.05;
            }

            requestAnimationFrame(animateBg);
        }
        animateBg();

        window.onload = function() {
            authPubNub = new PubNub({
                publishKey: 'demo',
                subscribeKey: 'demo',
                userId: myId
            });

            const activeUserHandle = localStorage.getItem("chat_current_active_handle");
            if (activeUserHandle) {
                let globalAccounts = JSON.parse(localStorage.getItem("chat_registered_accounts") || "{}");
                const account = globalAccounts[activeUserHandle.toLowerCase()];
                if (account) {
                    myUsername = account.username;
                    myName = account.displayName;
                    document.getElementById('auth-overlay').style.display = 'none';
                    initApp();
                }
            }
            setupVisibilityListener();
        };

        function setupVisibilityListener() {
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    setLookingStatus(false);
                } else {
                    setLookingStatus(true);
                }
            });
        }

        function setLookingStatus(looking) {
            isUserLooking = looking;
            userFocusStates[myUsername] = looking;
            updateUserEyeElements(myUsername, looking);

            if (activeRoomCode && pubnub) {
                pubnub.publish({
                    channel: "room_code_" + activeRoomCode,
                    message: {
                        type: 'focus_change',
                        sender: myName,
                        username: myUsername,
                        looking: looking
                    }
                });
            }
        }

        function toggleSidebar() {
            playSciFiSound('click');
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }

        function handleAuth() {
            playSciFiSound('click');
            const dispInput = document.getElementById('auth-displayname').value.trim();
            const userInput = document.getElementById('auth-username').value.trim().toLowerCase().replace('@', '');
            const passInput = document.getElementById('auth-pass').value.trim();
            const btn = document.getElementById('auth-btn');

            if (!dispInput) { alert("Please enter a Display Name!"); return; }
            if (!userInput) { alert("Please enter a @USER!"); return; }
            if (!passInput) { alert("Please set a password to secure your terminal link!"); return; }

            btn.disabled = true;
            btn.innerText = "Verifying Credentials...";

            authPubNub.fetchMessages({
                channels: [GLOBAL_REGISTRY_CHANNEL],
                count: 100
            }, function(status, response) {
                btn.disabled = false;
                btn.innerText = "Initialize Connection";

                let existingAccount = null;
                if (!status.error && response && response.channels[GLOBAL_REGISTRY_CHANNEL]) {
                    response.channels[GLOBAL_REGISTRY_CHANNEL].forEach(msgObj => {
                        if (msgObj.message && msgObj.message.username === userInput) {
                            existingAccount = msgObj.message;
                        }
                    });
                }

                let localAccounts = JSON.parse(localStorage.getItem("chat_registered_accounts") || "{}");

                if (existingAccount) {
                    if (existingAccount.pass === passInput) {
                        myUsername = userInput;
                        myName = dispInput;
                        localAccounts[userInput] = { displayName: myName, username: myUsername, pass: passInput };
                        localStorage.setItem("chat_registered_accounts", JSON.stringify(localAccounts));
                        localStorage.setItem("chat_current_active_handle", myUsername);
                        document.getElementById('auth-overlay').style.display = 'none';
                        initApp();
                        return;
                    } else {
                        alert("Incorrect password for @" + userInput + "! Access denied.");
                        return;
                    }
                }

                authPubNub.publish({
                    channel: GLOBAL_REGISTRY_CHANNEL,
                    message: { username: userInput, displayName: dispInput, pass: passInput }
                });

                localAccounts[userInput] = { displayName: dispInput, username: userInput, pass: passInput };
                localStorage.setItem("chat_registered_accounts", JSON.stringify(localAccounts));

                myUsername = userInput;
                myName = dispInput;
                localStorage.setItem("chat_current_active_handle", myUsername);
                document.getElementById('auth-overlay').style.display = 'none';
                initApp();
            });
        }

        function switchAccount() {
            playSciFiSound('click');
            localStorage.removeItem("chat_current_active_handle");
            location.reload();
        }

        function initApp() {
            document.getElementById('display-user').innerText = myName;
            document.getElementById('display-handle').innerText = "@" + myUsername;
            userFocusStates[myUsername] = true;

            const urlParams = new URLSearchParams(window.location.search);
            const inviteRoom = urlParams.get('room');
            const savedFriends = localStorage.getItem("chat_friends_" + myUsername);

            if (savedFriends) {
                try { friends = JSON.parse(savedFriends); } catch (e) { friends = []; }
            }
            renderFriends();

            userChannel = "user_direct_" + myUsername;

            pubnub = new PubNub({
                publishKey: 'demo',
                subscribeKey: 'demo',
                userId: myId
            });

            pubnub.addListener({
                status: function(statusEvent) {
                    if (statusEvent.category === "PNConnectedCategory") {
                        setOnline();
                    }
                },
                message: function(event) {
                    const data = event.message;
                    const channel = event.channel;

                    if (data.type === 'direct_room_invite') {
                        pendingInviteRoomCode = data.roomCode;
                        document.getElementById('popup-invite-text').innerText = `${data.from} (@${data.fromUsername}) invited you to channel [${data.roomCode}]!`;
                        document.getElementById('invite-popup-overlay').style.display = 'flex';
                        playSciFiSound('receive');
                        return;
                    }

                    if (data.type === 'friend_request') {
                        const exists = incomingRequests.some(r => r.username === data.fromUsername);
                        if (!exists) {
                            incomingRequests.push({ displayName: data.from, username: data.fromUsername });
                            document.getElementById('mail-badge').classList.add('active');
                            addSystemMsg(`⚡ Link request from ${data.from} (@${data.fromUsername})! Check Inbox.`);
                            renderInbox();
                            playSciFiSound('receive');
                        }
                        return;
                    }

                    if (data.type === 'friend_accept') {
                        const isAlreadyFriend = friends.some(f => f.username === data.fromUsername);
                        if (!isAlreadyFriend) {
                            friends.push({ displayName: data.from, username: data.fromUsername });
                            localStorage.setItem("chat_friends_" + myUsername, JSON.stringify(friends));
                            renderFriends();
                        }
                        systemMessages.push(`⚡ ${data.from} (@${data.fromUsername}) established link connection!`);
                        document.getElementById('mail-badge').classList.add('active');
                        addSystemMsg(`⚡ ${data.from} accepted your link request!`);
                        renderInbox();
                        playSciFiSound('receive');
                        return;
                    }

                    const targetRoom = channel.replace("room_code_", "");

                    if (data.type === 'typing') {
                        if (data.username !== myUsername && targetRoom === activeRoomCode) {
                            activeTypers[data.username] = data.isTyping;
                            updateTypingDisplay();
                        }
                        return;
                    }

                    if (data.type === 'reaction') {
                        if (targetRoom === activeRoomCode) {
                            handleIncomingReaction(data.msgId, data.emoji, data.username);
                        }
                        return;
                    }

                    if (data.type === 'presence') {
                        if (data.username !== myUsername) {
                            activeUsers.add(data.username);
                            renderFriends();
                            if (data.status === 'join') {
                                pubnub.publish({
                                    channel: channel,
                                    message: { type: 'presence_ack', sender: myName, username: myUsername, looking: isUserLooking }
                                });
                                addSystemMsgToRoom(targetRoom, `⚡ ${data.sender} entered the channel.`);
                            } else if (data.status === 'leave') {
                                addSystemMsgToRoom(targetRoom, `🔌 ${data.sender} disconnected.`);
                            }
                        }
                        return;
                    }

                    if (data.type === 'focus_change') {
                        if (data.username !== myUsername) {
                            userFocusStates[data.username] = data.looking;
                            updateUserEyeElements(data.username, data.looking);
                        }
                        return;
                    }

                    if (data.type === 'presence_ack') {
                        if (data.username !== myUsername) {
                            activeUsers.add(data.username);
                            if (typeof data.looking !== 'undefined') {
                                userFocusStates[data.username] = data.looking;
                                updateUserEyeElements(data.username, data.looking);
                            }
                            renderFriends();
                        }
                        return;
                    }

                    if (data.senderId !== myId) {
                        userFocusStates[data.username] = (typeof data.looking !== 'undefined') ? data.looking : true;
                        addMsgToRoom(targetRoom, data.senderId, data.sender, data.username, data.text, false, userFocusStates[data.username]);
                        playSciFiSound('receive');
                    }
                }
            });

            pubnub.subscribe({ channels: [userChannel] });

            if (inviteRoom) {
                connectToRoom(inviteRoom);
            } else {
                document.getElementById('room-display').innerText = "Channel: Offline";
                document.getElementById('messages').innerHTML = `<div style="text-align:center; color:#60a5fa; font-size:12px; margin-top:20px; font-family:'Orbitron',sans-serif; text-shadow:0 0 8px rgba(59,130,246,0.4);">Enter a Channel Code or click + to start transmitting!</div>`;
            }
        }

        function connectToRoom(rawCode) {
            playSciFiSound('click');
            const code = rawCode.toUpperCase();
            const channel = "room_code_" + code;

            if (!openRooms.includes(code)) {
                openRooms.push(code);
                roomAliases[code] = roomAliases[code] || code;
                roomMessages[code] = roomMessages[code] || [];
                pubnub.subscribe({ channels: [channel] });
                
                pubnub.publish({
                    channel: channel,
                    message: { type: 'presence', sender: myName, username: myUsername, status: 'join', looking: isUserLooking }
                });
            }

            switchRoomTab(code);
        }

        function switchRoomTab(code) {
            playSciFiSound('click');
            activeRoomCode = code;
            activeTypers = {};
            updateTypingDisplay();
            const displayName = roomAliases[code] || code;
            document.getElementById('room-display').innerText = "Channel: " + displayName + (displayName !== code ? ` (${code})` : '');
            renderTabs();
            renderActiveMessages();
        }

        function renameRoomTab(code) {
            playSciFiSound('click');
            const currentName = roomAliases[code] || code;
            const newName = prompt(`Enter custom alias for channel [${code}]:`, currentName);
            if (newName && newName.trim()) {
                roomAliases[code] = newName.trim();
                if (activeRoomCode === code) {
                    switchRoomTab(code);
                } else {
                    renderTabs();
                }
            }
        }

        function leaveCurrentRoom() {
            if (!activeRoomCode) return;
            closeRoomTab(activeRoomCode);
        }

        function closeRoomTab(code) {
            playSciFiSound('click');
            const channel = "room_code_" + code;

            pubnub.publish({
                channel: channel,
                message: { type: 'presence', sender: myName, username: myUsername, status: 'leave' }
            });

            pubnub.unsubscribe({ channels: [channel] });

            openRooms = openRooms.filter(r => r !== code);
            delete roomMessages[code];
            delete roomAliases[code];

            if (openRooms.length > 0) {
                switchRoomTab(openRooms[openRooms.length - 1]);
            } else {
                activeRoomCode = "";
                document.getElementById('room-display').innerText = "Channel: Offline";
                document.getElementById('messages').innerHTML = `<div style="text-align:center; color:#60a5fa; font-size:12px; margin-top:20px; font-family:'Orbitron',sans-serif; text-shadow:0 0 8px rgba(59,130,246,0.4);">All channels disconnected. Join or create one to resume!</div>`;
                activeTypers = {};
                updateTypingDisplay();
                renderTabs();
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabs-list');
            container.innerHTML = "";

            openRooms.forEach(room => {
                const displayName = roomAliases[room] || room;
                const tab = document.createElement('div');
                tab.className = `chat-tab ${room === activeRoomCode ? 'active' : ''}`;
                tab.onclick = () => switchRoomTab(room);
                tab.innerHTML = `
                    <span class="tab-title"># ${escape(displayName)}</span>
                    <span class="edit-tab-btn" onclick="event.stopPropagation(); renameRoomTab('${room}')" title="Rename Channel">✏️</span>
                    <span class="tab-close-btn" onclick="event.stopPropagation(); closeRoomTab('${room}')" title="Close Channel">&times;</span>
                `;
                container.appendChild(tab);
            });
        }

        function renderActiveMessages() {
            const box = document.getElementById('messages');
            box.innerHTML = "";
            if (!activeRoomCode || !roomMessages[activeRoomCode]) return;

            roomMessages[activeRoomCode].forEach(msgObj => {
                box.appendChild(createMessageDOMElement(msgObj));
            });
            box.scrollTop = box.scrollHeight;
        }

        function createMessageDOMElement(msgObj) {
            if (msgObj.isSystem) {
                const div = document.createElement('div');
                div.style.textAlign = 'center';
                div.style.fontSize = '11px';
                div.style.color = '#60a5fa';
                div.style.margin = '4px 0';
                div.style.fontFamily = "'Orbitron', sans-serif";
                div.style.textShadow = "0 0 6px rgba(59,130,246,0.4)";
                div.innerText = msgObj.text;
                return div;
            }

            const isLooking = userFocusStates[msgObj.username] !== false;
            const eyeIcon = isLooking ? '👁️' : '🙈';
            const eyeClass = isLooking ? 'looking' : 'away';

            const div = document.createElement('div');
            div.className = `msg ${msgObj.isSelf ? 'self' : ''}`;
            div.setAttribute('data-id', msgObj.id);
            
            let reactionsHtml = `<div class="msg-reactions" id="reactions-${msgObj.id}">`;
            if (msgObj.reactions) {
                for (let [emoji, users] of Object.entries(msgObj.reactions)) {
                    if (users.length > 0) {
                        reactionsHtml += `<span class="reaction-pill" onclick="toggleReaction('${msgObj.id}', '${emoji}')">${emoji} ${users.length}</span>`;
                    }
                }
            }
            reactionsHtml += `</div>`;

            div.innerHTML = `
                <div class="sender-header">
                    <span>${msgObj.isSelf ? 'You' : escape(msgObj.sender)}</span>
                    <span class="user-eye ${eyeClass}" data-username="${escape(msgObj.username)}" title="${isLooking ? 'Terminal active' : 'Terminal away'}">${eyeIcon}</span>
                </div>
                ${escape(msgObj.text)}
                ${reactionsHtml}
                <button type="button" class="add-reaction-btn" onclick="toggleReactionPicker('${msgObj.id}')" title="Add reaction">+</button>
                <div class="reaction-picker" id="picker-${msgObj.id}">
                    <span class="reaction-option" onclick="addReaction('${msgObj.id}', '⚡')">⚡</span>
                    <span class="reaction-option" onclick="addReaction('${msgObj.id}', '🤖')">🤖</span>
                    <span class="reaction-option" onclick="addReaction('${msgObj.id}', '💻')">💻</span>
                    <span class="reaction-option" onclick="addReaction('${msgObj.id}', '🔥')">🔥</span>
                    <span class="reaction-option" onclick="addReaction('${msgObj.id}', '💧')">💧</span>
                </div>
            `;
            return div;
        }

        function toggleReactionPicker(msgId) {
            playSciFiSound('click');
            const picker = document.getElementById(`picker-${msgId}`);
            picker.classList.toggle('open');
        }

        function addReaction(msgId, emoji) {
            playSciFiSound('click');
            const picker = document.getElementById(`picker-${msgId}`);
            picker.classList.remove('open');

            let msgObj = null;
            if (roomMessages[activeRoomCode]) {
                msgObj = roomMessages[activeRoomCode].find(m => m.id === msgId);
            }
            if (!msgObj) return;

            if (!msgObj.reactions) msgObj.reactions = {};
            if (!msgObj.reactions[emoji]) msgObj.reactions[emoji] = [];

            if (!msgObj.reactions[emoji].includes(myUsername)) {
                msgObj.reactions[emoji].push(myUsername);
            }

            updateMessageReactionsDOM(msgId, msgObj.reactions);

            pubnub.publish({
                channel: "room_code_" + activeRoomCode,
                message: {
                    type: 'reaction',
                    msgId: msgId,
                    emoji: emoji,
                    username: myUsername
                }
            });
        }

        function toggleReaction(msgId, emoji) {
            addReaction(msgId, emoji);
        }

        function handleIncomingReaction(msgId, emoji, username) {
            let msgObj = null;
            if (roomMessages[activeRoomCode]) {
                msgObj = roomMessages[activeRoomCode].find(m => m.id === msgId);
            }
            if (!msgObj) return;

            if (!msgObj.reactions) msgObj.reactions = {};
            if (!msgObj.reactions[emoji]) msgObj.reactions[emoji] = [];

            const idx = msgObj.reactions[emoji].indexOf(username);
            if (idx > -1) {
                msgObj.reactions[emoji].splice(idx, 1);
            } else {
                msgObj.reactions[emoji].push(username);
            }

            updateMessageReactionsDOM(msgId, msgObj.reactions);
        }

        function updateMessageReactionsDOM(msgId, reactions) {
            const container = document.getElementById(`reactions-${msgId}`);
            if (!container) return;
            container.innerHTML = "";
            for (let [emoji, users] of Object.entries(reactions)) {
                if (users.length > 0) {
                    const pill = document.createElement('span');
                    pill.className = "reaction-pill";
                    pill.onclick = () => toggleReaction(msgId, emoji);
                    pill.innerHTML = `${emoji} ${users.length}`;
                    container.appendChild(pill);
                }
            }
        }

        function updateUserEyeElements(username, looking) {
            const eyeElements = document.querySelectorAll(`.user-eye[data-username="${username}"]`);
            eyeElements.forEach(eye => {
                eye.innerText = looking ? '👁️' : '🙈';
                eye.className = `user-eye ${looking ? 'looking' : 'away'}`;
                eye.title = looking ? 'Terminal active' : 'Terminal away';
            });
        }

        function addMsgToRoom(roomCode, msgId, sender, username, text, isSelf, looking) {
            const msgObj = {
                id: msgId || ("msg_" + Math.random().toString(36).substr(2, 9)),
                sender: sender,
                username: username,
                text: text,
                isSelf: isSelf,
                isSystem: false,
                reactions: {}
            };

            if (!roomMessages[roomCode]) roomMessages[roomCode] = [];
            roomMessages[roomCode].push(msgObj);

            if (roomCode === activeRoomCode) {
                const box = document.getElementById('messages');
                box.appendChild(createMessageDOMElement(msgObj));
                box.scrollTop = box.scrollHeight;
            }
        }

        function addSystemMsgToRoom(roomCode, text) {
            const msgObj = { text: text, isSystem: true };

            if (!roomMessages[roomCode]) roomMessages[roomCode] = [];
            roomMessages[roomCode].push(msgObj);

            if (roomCode === activeRoomCode) {
                const box = document.getElementById('messages');
                box.appendChild(createMessageDOMElement(msgObj));
                box.scrollTop = box.scrollHeight;
            }
        }

        function handleTypingInput() {
            if (!activeRoomCode || !pubnub) return;

            if (!isCurrentlyTyping) {
                isCurrentlyTyping = true;
                pubnub.publish({
                    channel: "room_code_" + activeRoomCode,
                    message: { type: 'typing', username: myUsername, isTyping: true }
                });
            }

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                isCurrentlyTyping = false;
                pubnub.publish({
                    channel: "room_code_" + activeRoomCode,
                    message: { type: 'typing', username: myUsername, isTyping: false }
                });
            }, 1500);
        }

        function updateTypingDisplay() {
            const indicator = document.getElementById('typing-indicator');
            const typingUsers = Object.keys(activeTypers).filter(u => activeTypers[u]);

            if (typingUsers.length === 0) {
                indicator.innerText = "";
            } else if (typingUsers.length === 1) {
                indicator.innerText = `⚡ @${typingUsers[0]} is transmitting...`;
            } else {
                indicator.innerText = `⚡ Multiple terminals transmitting...`;
            }
        }

        function directInviteFriend(friendUsername) {
            playSciFiSound('click');
            if (!activeRoomCode) {
                alert("You need to join or create a channel first!");
                return;
            }

            pubnub.publish({
                channel: "user_direct_" + friendUsername,
                message: {
                    type: 'direct_room_invite',
                    from: myName,
                    fromUsername: myUsername,
                    roomCode: activeRoomCode
                }
            });

            addSystemMsg(`Room invite sent to @${friendUsername}!`);
        }

        function acceptRoomInvite() {
            playSciFiSound('click');
            document.getElementById('invite-popup-overlay').style.display = 'none';
            if (pendingInviteRoomCode) {
                connectToRoom(pendingInviteRoomCode);
            }
        }

        function declineRoomInvite() {
            playSciFiSound('click');
            document.getElementById('invite-popup-overlay').style.display = 'none';
            pendingInviteRoomCode = "";
        }

        function toggleInbox() {
            playSciFiSound('click');
            const modal = document.getElementById('inbox-modal');
            const isShowing = modal.style.display === 'flex';
            modal.style.display = isShowing ? 'none' : 'flex';
            if (!isShowing) {
                document.getElementById('mail-badge').classList.remove('active');
                renderInbox();
            }
        }

        function switchInboxTab(tab) {
            playSciFiSound('click');
            currentTab = tab;
            document.getElementById('tab-requests').classList.toggle('active', tab === 'requests');
            document.getElementById('tab-system').classList.toggle('active', tab === 'system');
            renderInbox();
        }

        function renderInbox() {
            const container = document.getElementById('inbox-content');
            container.innerHTML = "";

            if (currentTab === 'requests') {
                if (incomingRequests.length === 0) {
                    container.innerHTML = `<span style="font-size:11px; color:#60a5fa;">No pending signals</span>`;
                    return;
                }
                incomingRequests.forEach(req => {
                    const card = document.createElement('div');
                    card.className = "req-card";
                    card.innerHTML = `
                        <div style="display:flex; flex-direction:column;">
                            <span style="font-size:11px; font-weight:600; color:#fff;">${escape(req.displayName)}</span>
                            <span style="font-size:9px; color:#60a5fa;">@${escape(req.username)}</span>
                        </div>
                        <div class="req-actions">
                            <button type="button" class="btn-accept" onclick="acceptRequest('${escape(req.displayName)}', '${escape(req.username)}')">Link</button>
                            <button type="button" class="btn-decline" onclick="declineRequest('${escape(req.username)}')">Drop</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                if (systemMessages.length === 0) {
                    container.innerHTML = `<span style="font-size:11px; color:#60a5fa;">No system logs</span>`;
                    return;
                }
                systemMessages.forEach(msg => {
                    const card = document.createElement('div');
                    card.className = "req-card";
                    card.innerHTML = `<span style="font-size:11px; color:#e9d5ff;">${escape(msg)}</span>`;
                    container.appendChild(card);
                });
            }
        }

        function sendFriendRequest() {
            playSciFiSound('click');
            const input = document.getElementById('friend-input');
            const friendHandle = input.value.trim().toLowerCase().replace('@', '');
            if (!friendHandle || !pubnub) return;

            if (friendHandle === myUsername) {
                alert("You cannot link yourself!");
                return;
            }

            pubnub.publish({
                channel: "user_direct_" + friendHandle,
                message: {
                    type: 'friend_request',
                    from: myName,
                    fromUsername: myUsername
                }
            });

            addSystemMsg(`Link request sent to @${friendHandle}!`);
            input.value = "";
        }

        function acceptRequest(fromName, fromUsername) {
            playSciFiSound('click');
            const isAlreadyFriend = friends.some(f => f.username === fromUsername);
            if (!isAlreadyFriend) {
                friends.push({ displayName: fromName, username: fromUsername });
                localStorage.setItem("chat_friends_" + myUsername, JSON.stringify(friends));
                renderFriends();
            }

            incomingRequests = incomingRequests.filter(u => u.username !== fromUsername);
            renderInbox();

            pubnub.publish({
                channel: "user_direct_" + fromUsername,
                message: {
                    type: 'friend_accept',
                    from: myName,
                    fromUsername: myUsername
                }
            });

            addSystemMsg(`Link established with ${fromName}!`);
        }

        function declineRequest(fromUsername) {
            playSciFiSound('click');
            incomingRequests = incomingRequests.filter(u => u.username !== fromUsername);
            renderInbox();
        }

        function removeFriend(index) {
            playSciFiSound('click');
            const friend = friends[index];
            const confirmed = confirm(`Terminate connection with ${friend.displayName} (@${friend.username})?`);
            if (confirmed) {
                friends.splice(index, 1);
                localStorage.setItem("chat_friends_" + myUsername, JSON.stringify(friends));
                renderFriends();
            }
        }

        function renderFriends() {
            const list = document.getElementById('friends-list');
            list.innerHTML = "";

            friends.forEach((friend, idx) => {
                const isOnline = activeUsers.has(friend.username);
                const card = document.createElement('div');
                card.className = "friend-card";
                card.innerHTML = `
                    <div class="friend-info">
                        <div class="status-dot ${isOnline ? 'online' : ''}"></div>
                        <div class="friend-details">
                            <span class="friend-name">${escape(friend.displayName)}</span>
                            <span class="friend-handle">@${escape(friend.username)}</span>
                        </div>
                    </div>
                    <div class="friend-actions">
                        <button type="button" class="btn-invite-friend" onclick="directInviteFriend('${escape(friend.username)}')">Invite</button>
                        <span class="remove-friend" onclick="removeFriend(${idx})" title="Terminate Link">&times;</span>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function promptJoinRoom() {
            playSciFiSound('click');
            const code = prompt("Enter Channel Code (e.g. CYBER99):");
            if (code && code.trim()) {
                connectToRoom(code.trim());
                if (window.innerWidth <= 768) {
                    toggleSidebar();
                }
            }
        }

        function inviteFriend() {
            playSciFiSound('click');
            if (!activeRoomCode) {
                alert("Please join or create a channel first!");
                return;
            }

            const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${activeRoomCode}`;

            navigator.clipboard.writeText(inviteUrl).then(() => {
                addSystemMsg("⚡ Channel link copied to clipboard!");
            }).catch(() => {
                addSystemMsg(`Channel code: ${activeRoomCode}`);
            });
        }

        function send() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();

            if (!activeRoomCode || !pubnub) {
                alert("Please join or create a channel first!");
                return;
            }

            if (!text) return;

            const msgId = "msg_" + Math.random().toString(36).substr(2, 9);
            playSciFiSound('send');
            addMsgToRoom(activeRoomCode, msgId, myName, myUsername, text, true, isUserLooking);
            input.value = "";

            isCurrentlyTyping = false;
            pubnub.publish({
                channel: "room_code_" + activeRoomCode,
                message: { type: 'typing', username: myUsername, isTyping: false }
            });

            pubnub.publish({
                channel: "room_code_" + activeRoomCode,
                message: {
                    id: msgId,
                    senderId: myId,
                    sender: myName,
                    username: myUsername,
                    text: text,
                    looking: isUserLooking
                }
            });
        }

        function setOnline() {
            const badge = document.getElementById('status-badge');
            badge.innerText = "System Online";
            badge.classList.add('online');
        }

        function addSystemMsg(text) {
            if (!activeRoomCode) return;
            addSystemMsgToRoom(activeRoomCode, text);
        }

        function escape(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
