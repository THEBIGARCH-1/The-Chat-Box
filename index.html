<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Live Room Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0d0e15; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #chat-container { width: 90vw; max-width: 800px; height: 85vh; background: #1a1d2e; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #3b4252; }
        #chat-header { padding: 16px 20px; background: #141625; border-bottom: 1px solid #2e3440; display: flex; justify-content: space-between; align-items: center; }
        .status { font-size: 12px; padding: 6px 12px; border-radius: 12px; background: #bf616a; color: #fff; font-weight: bold; }
        .status.online { background: #a3be8c; color: #1a1d2e; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #2e3440; padding: 10px 14px; border-radius: 8px; max-width: 75%; width: fit-content; word-break: break-word; }
        .msg.self { align-self: flex-end; background: #5e81ac; }
        .msg .sender { font-size: 11px; color: #d8dee9; margin-bottom: 3px; display: block; font-weight: bold; }
        #input-area { padding: 15px; background: #141625; display: flex; gap: 10px; border-top: 1px solid #2e3440; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #3b4252; background: #2e3440; color: #fff; outline: none; }
        button { padding: 12px 20px; background: #88c0d0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #1a1d2e; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 10; }
        .modal { background: #1a1d2e; padding: 30px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; text-align: center; width: 320px; border: 1px solid #3b4252; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="modal">
            <h2>Enter Live Room</h2>
            <p style="font-size: 12px; color: #88c0d0;">Enter a name & room code to chat!</p>
            <input type="text" id="username" placeholder="Your Name" maxlength="15">
            <input type="text" id="roomcode" placeholder="Room Code (e.g. CHAT99)" maxlength="15">
            <button onclick="joinRoom()">Join Room</button>
        </div>
    </div>

    <div id="chat-container">
        <div id="chat-header">
            <span id="room-display" style="font-weight: bold;">Room: ----</span>
            <span id="status-badge" class="status">Disconnected</span>
        </div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="message-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">Send</button>
        </div>
    </div>

    <script>
        let ws = null;
        let myName = "User";
        let roomTopic = "";
        const clientID = 'usr_' + Math.random().toString(36).substr(2, 9);

        function joinRoom() {
            myName = document.getElementById('username').value.trim() || "User";
            const rawCode = document.getElementById('roomcode').value.trim().toUpperCase();

            if (!rawCode) {
                alert("Please enter a room code!");
                return;
            }

            // Create a unique channel name based on your code
            roomTopic = "thebigarch_chat_v1_" + rawCode;

            document.getElementById('room-display').innerText = "Room: " + rawCode;
            document.getElementById('overlay').style.display = 'none';

            addSystemMsg("Connecting to network...");

            // Connect over standard, encrypted WebSocket
            ws = new WebSocket(`wss://ntfy.sh/${roomTopic}/ws`);

            ws.onopen = () => {
                setOnline();
                addSystemMsg(`Connected! Tell your friends to enter code [${rawCode}] to join.`);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    // Handle incoming message events
                    if (data.event === 'message' && data.message) {
                        const payload = JSON.parse(data.message);
                        if (payload.id !== clientID) {
                            addMsg(payload.sender, payload.text, false);
                        }
                    }
                } catch (e) {
                    // Ignore non-JSON system signals
                }
            };

            ws.onerror = () => {
                addSystemMsg("Connection issue. Try clicking Join again.");
            };

            ws.onclose = () => {
                const badge = document.getElementById('status-badge');
                badge.innerText = "Disconnected";
                badge.classList.remove('online');
            };
        }

        async function send() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !roomTopic) return;

            const payload = {
                id: clientID,
                sender: myName,
                text: text
            };

            // Display locally immediately
            addMsg(myName, text, true);
            input.value = "";

            // Broadcast message across the cloud network
            try {
                await fetch(`https://ntfy.sh/${roomTopic}`, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                addSystemMsg("Failed to deliver message.");
            }
        }

        function setOnline() {
            const badge = document.getElementById('status-badge');
            badge.innerText = "Connected Live!";
            badge.classList.add('online');
        }

        function addMsg(sender, text, isSelf) {
            const box = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `msg ${isSelf ? 'self' : ''}`;
            div.innerHTML = `<span class="sender">${sender}</span>${escape(text)}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function addSystemMsg(text) {
            const box = document.getElementById('messages');
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.fontSize = '12px';
            div.style.color = '#88c0d0';
            div.style.margin = '4px 0';
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function escape(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
