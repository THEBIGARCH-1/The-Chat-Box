<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instant Live Room Chat</title>
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #08090d;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: #f3f4f6;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #app-container {
            width: 95vw;
            max-width: 1100px;
            height: 88vh;
            height: 88dvh;
            background: rgba(18, 20, 29, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            display: flex;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        /* Account Auth Overlay */
        #auth-overlay, #invite-popup-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 9, 13, 0.85);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 16px;
        }

        #invite-popup-overlay {
            display: none;
            z-index: 300;
        }

        .auth-card, .popup-card {
            background: rgba(22, 25, 38, 0.95);
            padding: 24px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 340px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .auth-card h2, .popup-card h2 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-card p, .popup-card p {
            font-size: 12px;
            color: #a1a1aa;
        }

        .popup-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* Sidebar */
        #sidebar {
            width: 280px;
            background: rgba(12, 14, 22, 0.8);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 16px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            position: relative;
        }

        .sidebar-close-btn {
            display: none;
            position: absolute;
            top: 14px;
            right: 16px;
            font-size: 22px;
            color: #a1a1aa;
            cursor: pointer;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-close-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .user-profile-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .user-profile-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .user-profile-box label {
            font-size: 10px;
            font-weight: 600;
            color: #a1a1aa;
        }

        .user-profile-box span.disp-name {
            font-size: 14px;
            font-weight: 700;
            color: #a5b4fc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-profile-box span.usr-handle {
            font-size: 11px;
            color: #6b7280;
        }

        .room-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-friend-box {
            display: flex;
            gap: 6px;
        }

        .add-friend-box input, .auth-card input {
            padding: 10px 14px;
            font-size: 12px;
        }

        #friends-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .friend-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .friend-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6b7280;
            box-shadow: 0 0 6px rgba(107, 114, 128, 0.5);
            flex-shrink: 0;
        }

        .status-dot.online {
            background: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.8);
        }

        .friend-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .friend-name {
            font-size: 13px;
            font-weight: 600;
            color: #f3f4f6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .friend-handle {
            font-size: 10px;
            color: #6b7280;
        }

        .friend-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-invite-friend {
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
            padding: 4px 8px;
            font-size: 10px;
            border-radius: 6px;
        }

        .btn-invite-friend:hover {
            background: rgba(99, 102, 241, 0.4);
        }

        .remove-friend {
            color: #ef4444;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.6;
            padding: 4px;
        }

        .remove-friend:hover { opacity: 1; }

        /* Main Chat Area */
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
        }

        #tabs-bar {
            background: rgba(8, 9, 13, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            padding: 6px 12px 0 12px;
            gap: 6px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }

        #tabs-bar::-webkit-scrollbar {
            height: 4px;
        }

        #tabs-bar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        #tabs-list {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-tab {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: none;
            padding: 6px 12px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            font-size: 12px;
            color: #a1a1aa;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
            max-width: 200px;
        }

        .chat-tab.active {
            background: rgba(22, 25, 38, 0.95);
            color: #ffffff;
            border-color: rgba(99, 102, 241, 0.4);
            font-weight: 600;
        }

        .tab-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .edit-tab-btn {
            font-size: 10px;
            opacity: 0.5;
            cursor: pointer;
        }

        .edit-tab-btn:hover { opacity: 1; }

        .tab-close-btn {
            font-size: 12px;
            color: #ef4444;
            opacity: 0.6;
            cursor: pointer;
        }

        .tab-close-btn:hover { opacity: 1; }

        .add-tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a1a1aa;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        #chat-header {
            padding: 12px 18px;
            background: rgba(12, 14, 22, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        #room-display {
            font-size: 15px;
            font-weight: 700;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .inbox-btn, .menu-toggle-btn {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #a1a1aa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-toggle-btn { display: none; }

        .green-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            border: 2px solid #08090d;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.9);
            display: none;
        }

        .green-badge.active { display: block; }

        .header-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            color: #a1a1aa;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-leave-room {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .btn-leave-room:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .status {
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-weight: 600;
            white-space: nowrap;
        }

        .status.online {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border-color: rgba(34, 197, 94, 0.3);
        }

        #messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            background: rgba(30, 34, 48, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            border-radius: 14px;
            border-top-left-radius: 4px;
            max-width: 80%;
            width: fit-content;
            word-break: break-word;
            font-size: 13px;
            line-height: 1.4;
            color: #e5e7eb;
        }

        .msg.self {
            align-self: flex-end;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            color: #ffffff;
            border-radius: 14px;
            border-top-right-radius: 4px;
        }

        .msg .sender-header {
            font-size: 11px;
            color: #a1a1aa;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .msg.self .sender-header {
            color: rgba(255, 255, 255, 0.85);
            justify-content: flex-end;
        }

        .user-eye {
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .user-eye.looking {
            color: #22c55e;
            filter: drop-shadow(0 0 4px rgba(34, 197, 94, 0.8));
        }

        .user-eye.away {
            color: #6b7280;
            filter: grayscale(100%);
            opacity: 0.5;
        }

        #input-area {
            padding: 12px 16px;
            background: rgba(12, 14, 22, 0.6);
            display: flex;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        input[type="text"], input[type="password"] {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(22, 25, 38, 0.8);
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        button {
            padding: 10px 16px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            color: #ffffff;
            font-size: 12px;
            white-space: nowrap;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #inbox-modal {
            display: none;
            position: absolute;
            top: 55px;
            right: 12px;
            width: calc(100% - 24px);
            max-width: 320px;
            background: rgba(22, 25, 38, 0.98);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            padding: 14px;
            z-index: 100;
            flex-direction: column;
            gap: 10px;
        }

        .inbox-tabs {
            display: flex;
            gap: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
        }

        .inbox-tab {
            font-size: 11px;
            font-weight: 600;
            color: #a1a1aa;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
        }

        .inbox-tab.active {
            color: #ffffff;
            background: rgba(99, 102, 241, 0.3);
        }

        .req-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .req-actions { display: flex; gap: 4px; }
        .req-actions button { padding: 4px 6px; font-size: 10px; border-radius: 6px; }
        .btn-accept { background: #22c55e; }
        .btn-decline { background: #ef4444; }

        @media (max-width: 768px) {
            body { padding: 0; }
            #app-container { 
                width: 100vw; 
                height: 100vh; 
                height: 100dvh; 
                border-radius: 0; 
                border: none;
                flex-direction: column; 
            }
            .menu-toggle-btn { display: flex; }
            .sidebar-close-btn { display: block; }
            #sidebar { 
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 90;
                background: rgba(12, 14, 22, 0.98);
                backdrop-filter: blur(25px);
                transform: translateX(-100%);
                padding-top: 50px;
            }
            #sidebar.open { transform: translateX(0); }
            .status { display: none; }
            #chat-header { height: 50px; }
        }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>Account Portal</h2>
            <p id="auth-subtext">Enter your details. Enter exact password to access on another device!</p>
            <input type="text" id="auth-displayname" placeholder="Display Name (e.g. Alex)" maxlength="15" autocomplete="off">
            <input type="text" id="auth-username" placeholder="@Username (e.g. alex_99)" maxlength="15" autocapitalize="none" autocomplete="off">
            <input type="password" id="auth-pass" placeholder="Password (Required for multi-device)" maxlength="20">
            <button type="button" id="auth-btn" onclick="handleAuth()">Continue</button>
        </div>
    </div>

    <div id="invite-popup-overlay">
        <div class="popup-card">
            <h2>Room Invite!</h2>
            <p id="popup-invite-text">Your friend invited you to join their room.</p>
            <div class="popup-actions">
                <button type="button" onclick="acceptRoomInvite()">Join Room</button>
                <button type="button" class="btn-secondary" onclick="declineRoomInvite()">Decline</button>
            </div>
        </div>
    </div>

    <div id="app-container">
        <div id="sidebar">
            <span class="sidebar-close-btn" onclick="toggleSidebar()" title="Close Friends List">&times;</span>

            <div class="user-profile-box">
                <div class="user-profile-info">
                    <label>Logged in as</label>
                    <span id="display-user" class="disp-name">--</span>
                    <span id="display-handle" class="usr-handle">--</span>
                </div>
                <button type="button" class="btn-secondary" style="padding:4px 8px; font-size:10px;" onclick="switchAccount()">Switch Account</button>
            </div>

            <div class="room-actions">
                <button type="button" onclick="promptJoinRoom()">Create / Join Room</button>
            </div>

            <div class="sidebar-title">
                <span>Friends List</span>
            </div>
            <div class="add-friend-box">
                <input type="text" id="friend-input" placeholder="@Username" autocapitalize="none" autocomplete="off">
                <button type="button" class="btn-secondary" onclick="sendFriendRequest()">Add</button>
            </div>
            <div id="friends-list"></div>
        </div>

        <div id="chat-container">
            <div id="tabs-bar">
                <div id="tabs-list"></div>
                <div class="add-tab-btn" onclick="promptJoinRoom()" title="Open New Room">+</div>
            </div>

            <div id="chat-header">
                <button type="button" class="menu-toggle-btn" onclick="toggleSidebar()" title="Toggle Menu">👥</button>
                <span id="room-display">Room: Not Connected</span>
                
                <div class="header-actions">
                    <button type="button" class="inbox-btn" onclick="toggleInbox()" title="Inbox / Notifications">
                        ✉️
                        <span id="mail-badge" class="green-badge"></span>
                    </button>

                    <button type="button" class="header-btn btn-leave-room" onclick="leaveCurrentRoom()">🚪 Leave Chat</button>
                    <button type="button" class="header-btn" onclick="inviteFriend()">🔗 Invite</button>
                    <span id="status-badge" class="status">Disconnected</span>
                </div>
            </div>

            <div id="messages"></div>

            <div id="input-area">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" onkeypress="if(event.key==='Enter') send()">
                <button type="button" onclick="send()">Send</button>
            </div>
        </div>

        <div id="inbox-modal">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="font-size:13px;">Inbox</h3>
                <span style="cursor:pointer; font-weight:bold;" onclick="toggleInbox()">&times;</span>
            </div>
            
            <div class="inbox-tabs">
                <div id="tab-requests" class="inbox-tab active" onclick="switchInboxTab('requests')">Friend Requests</div>
                <div id="tab-system" class="inbox-tab" onclick="switchInboxTab('system')">System Messages</div>
            </div>

            <div id="inbox-content" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>
    </div>

    <script>
        let pubnub = null;
        let authPubNub = null;
        let myName = "";        
        let myUsername = "";    
        let userChannel = "";
        let activeRoomCode = "";
        let pendingInviteRoomCode = "";
        let openRooms = [];
        let roomAliases = {};
        let roomMessages = {};  
        let userFocusStates = {}; 
        let friends = [];
        let incomingRequests = [];
        let systemMessages = [];
        let activeUsers = new Set();
        let currentTab = 'requests';
        let isUserLooking = true;
        const myId = "usr_" + Math.random().toString(36).substr(2, 9);
        const GLOBAL_REGISTRY_CHANNEL = "global_user_registry_sync";

        window.onload = function() {
            authPubNub = new PubNub({
                publishKey: 'demo',
                subscribeKey: 'demo',
                userId: myId
            });

            const activeUserHandle = localStorage.getItem("chat_current_active_handle");
            if (activeUserHandle) {
                let globalAccounts = JSON.parse(localStorage.getItem("chat_registered_accounts") || "{}");
                const account = globalAccounts[activeUserHandle.toLowerCase()];
                if (account) {
                    myUsername = account.username;
                    myName = account.displayName;
                    document.getElementById('auth-overlay').style.display = 'none';
                    initApp();
                }
            }
            setupVisibilityListener();
        };

        function setupVisibilityListener() {
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    setLookingStatus(false);
                } else {
                    setLookingStatus(true);
                }
            });
        }

        function setLookingStatus(looking) {
            isUserLooking = looking;
            userFocusStates[myUsername] = looking;
            updateUserEyeElements(myUsername, looking);

            if (activeRoomCode && pubnub) {
                pubnub.publish({
                    channel: "room_code_" + activeRoomCode,
                    message: {
                        type: 'focus_change',
                        sender: myName,
                        username: myUsername,
                        looking: looking
                    }
                });
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }

        function handleAuth() {
            const dispInput = document.getElementById('auth-displayname').value.trim();
            const userInput = document.getElementById('auth-username').value.trim().toLowerCase().replace('@', '');
            const passInput = document.getElementById('auth-pass').value.trim();
            const btn = document.getElementById('auth-btn');

            if (!dispInput) {
                alert("Please enter a Display Name!");
                return;
            }

            if (!userInput) {
                alert("Please enter a Username!");
                return;
            }

            if (!passInput) {
                alert("Please set a password to secure your account!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Verifying Credentials...";

            // Fetch global registry records from PubNub channel
            authPubNub.fetchMessages({
                channels: [GLOBAL_REGISTRY_CHANNEL],
                count: 100
            }, function(status, response) {
                btn.disabled = false;
                btn.innerText = "Continue";

                let existingAccount = null;

                if (!status.error && response && response.channels[GLOBAL_REGISTRY_CHANNEL]) {
                    response.channels[GLOBAL_REGISTRY_CHANNEL].forEach(msgObj => {
                        if (msgObj.message && msgObj.message.username === userInput) {
                            existingAccount = msgObj.message;
                        }
                    });
                }

                let localAccounts = JSON.parse(localStorage.getItem("chat_registered_accounts") || "{}");

                // Account exists globally
                if (existingAccount) {
                    if (existingAccount.pass === passInput) {
                        // Password matches cross-device! Grant entry.
                        myUsername = userInput;
                        myName = dispInput;
                        localAccounts[userInput] = { displayName: myName, username: myUsername, pass: passInput };
                        localStorage.setItem("chat_registered_accounts", JSON.stringify(localAccounts));
                        localStorage.setItem("chat_current_active_handle", myUsername);
                        document.getElementById('auth-overlay').style.display = 'none';
                        initApp();
                        return;
                    } else {
                        alert("Incorrect password for @" + userInput + "! Account is locked on other devices.");
                        return;
                    }
                }

                // New account creation
                authPubNub.publish({
                    channel: GLOBAL_REGISTRY_CHANNEL,
                    message: { username: userInput, displayName: dispInput, pass: passInput }
                });

                localAccounts[userInput] = { displayName: dispInput, username: userInput, pass: passInput };
                localStorage.setItem("chat_registered_accounts", JSON.stringify(localAccounts));

                myUsername = userInput;
                myName = dispInput;
                localStorage.setItem("chat_current_active_handle", myUsername);
                document.getElementById('auth-overlay').style.display = 'none';
                initApp();
            });
        }

        function switchAccount() {
            localStorage.removeItem("chat_current_active_handle");
            location.reload();
        }

        function initApp() {
            document.getElementById('display-user').innerText = myName;
            document.getElementById('display-handle').innerText = "@" + myUsername;
            userFocusStates[myUsername] = true;

            const urlParams = new URLSearchParams(window.location.search);
            const inviteRoom = urlParams.get('room');
            const savedFriends = localStorage.getItem("chat_friends_" + myUsername);

            if (savedFriends) {
                try { friends = JSON.parse(savedFriends); } catch (e) { friends = []; }
            }
            renderFriends();

            userChannel = "user_direct_" + myUsername;

            pubnub = new PubNub({
                publishKey: 'demo',
                subscribeKey: 'demo',
                userId: myId
            });

            pubnub.addListener({
                status: function(statusEvent) {
                    if (statusEvent.category === "PNConnectedCategory") {
                        setOnline();
                    }
                },
                message: function(event) {
                    const data = event.message;
                    const channel = event.channel;

                    if (data.type === 'direct_room_invite') {
                        pendingInviteRoomCode = data.roomCode;
                        document.getElementById('popup-invite-text').innerText = `${data.from} (@${data.fromUsername}) invited you to join Room [${data.roomCode}]!`;
                        document.getElementById('invite-popup-overlay').style.display = 'flex';
                        return;
                    }

                    if (data.type === 'friend_request') {
                        const exists = incomingRequests.some(r => r.username === data.fromUsername);
                        if (!exists) {
                            incomingRequests.push({ displayName: data.from, username: data.fromUsername });
                            document.getElementById('mail-badge').classList.add('active');
                            addSystemMsg(`🔔 Friend request from ${data.from} (@${data.fromUsername})! Check Inbox.`);
                            renderInbox();
                        }
                        return;
                    }

                    if (data.type === 'friend_accept') {
                        const isAlreadyFriend = friends.some(f => f.username === data.fromUsername);
                        if (!isAlreadyFriend) {
                            friends.push({ displayName: data.from, username: data.fromUsername });
                            localStorage.setItem("chat_friends_" + myUsername, JSON.stringify(friends));
                            renderFriends();
                        }
                        systemMessages.push(`🎉 ${data.from} (@${data.fromUsername}) accepted your friend request!`);
                        document.getElementById('mail-badge').classList.add('active');
                        addSystemMsg(`🎉 ${data.from} accepted your friend request!`);
                        renderInbox();
                        return;
                    }

                    const targetRoom = channel.replace("room_code_", "");

                    if (data.type === 'presence') {
                        if (data.username !== myUsername) {
                            activeUsers.add(data.username);
                            renderFriends();
                            if (data.status === 'join') {
                                pubnub.publish({
                                    channel: channel,
                                    message: { type: 'presence_ack', sender: myName, username: myUsername, looking: isUserLooking }
                                });
                                addSystemMsgToRoom(targetRoom, `👋 ${data.sender} joined the room!`);
                            } else if (data.status === 'leave') {
                                addSystemMsgToRoom(targetRoom, `🚪 ${data.sender} left the chat.`);
                            }
                        }
                        return;
                    }

                    if (data.type === 'focus_change') {
                        if (data.username !== myUsername) {
                            userFocusStates[data.username] = data.looking;
                            updateUserEyeElements(data.username, data.looking);
                        }
                        return;
                    }

                    if (data.type === 'presence_ack') {
                        if (data.username !== myUsername) {
                            activeUsers.add(data.username);
                            if (typeof data.looking !== 'undefined') {
                                userFocusStates[data.username] = data.looking;
                                updateUserEyeElements(data.username, data.looking);
                            }
                            renderFriends();
                        }
                        return;
                    }

                    if (data.senderId !== myId) {
                        userFocusStates[data.username] = (typeof data.looking !== 'undefined') ? data.looking : true;
                        addMsgToRoom(targetRoom, data.sender, data.username, data.text, false, userFocusStates[data.username]);
                    }
                }
            });

            pubnub.subscribe({ channels: [userChannel] });

            // Only connect to a room if invited directly via URL parameter
            if (inviteRoom) {
                connectToRoom(inviteRoom);
            } else {
                document.getElementById('room-display').innerText = "Not Connected";
                document.getElementById('messages').innerHTML = `<div style="text-align:center; color:#a1a1aa; font-size:12px; margin-top:20px;">Enter a Room Code or click + to join/create a room!</div>`;
            }
        }

        function connectToRoom(rawCode) {
            const code = rawCode.toUpperCase();
            const channel = "room_code_" + code;

            if (!openRooms.includes(code)) {
                openRooms.push(code);
                roomAliases[code] = roomAliases[code] || code;
                roomMessages[code] = roomMessages[code] || [];
                pubnub.subscribe({ channels: [channel] });
                
                pubnub.publish({
                    channel: channel,
                    message: { type: 'presence', sender: myName, username: myUsername, status: 'join', looking: isUserLooking }
                });
            }

            switchRoomTab(code);
        }

        function switchRoomTab(code) {
            activeRoomCode = code;
            const displayName = roomAliases[code] || code;
            document.getElementById('room-display').innerText = "Room: " + displayName + (displayName !== code ? ` (${code})` : '');
            renderTabs();
            renderActiveMessages();
        }

        function renameRoomTab(code) {
            const currentName = roomAliases[code] || code;
            const newName = prompt(`Enter a custom name for room [${code}]:`, currentName);
            if (newName && newName.trim()) {
                roomAliases[code] = newName.trim();
                if (activeRoomCode === code) {
                    switchRoomTab(code);
                } else {
                    renderTabs();
                }
            }
        }

        function leaveCurrentRoom() {
            if (!activeRoomCode) return;
            closeRoomTab(activeRoomCode);
        }

        function closeRoomTab(code) {
            const channel = "room_code_" + code;

            pubnub.publish({
                channel: channel,
                message: { type: 'presence', sender: myName, username: myUsername, status: 'leave' }
            });

            pubnub.unsubscribe({ channels: [channel] });

            openRooms = openRooms.filter(r => r !== code);
            delete roomMessages[code];
            delete roomAliases[code];

            if (openRooms.length > 0) {
                switchRoomTab(openRooms[openRooms.length - 1]);
            } else {
                activeRoomCode = "";
                document.getElementById('room-display').innerText = "Not Connected";
                document.getElementById('messages').innerHTML = `<div style="text-align:center; color:#a1a1aa; font-size:12px; margin-top:20px;">You left all rooms. Join or create a room to continue!</div>`;
                renderTabs();
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabs-list');
            container.innerHTML = "";

            openRooms.forEach(room => {
                const displayName = roomAliases[room] || room;
                const tab = document.createElement('div');
                tab.className = `chat-tab ${room === activeRoomCode ? 'active' : ''}`;
                tab.onclick = () => switchRoomTab(room);
                tab.innerHTML = `
                    <span class="tab-title"># ${escape(displayName)}</span>
                    <span class="edit-tab-btn" onclick="event.stopPropagation(); renameRoomTab('${room}')" title="Rename Chat">✏️</span>
                    <span class="tab-close-btn" onclick="event.stopPropagation(); closeRoomTab('${room}')" title="Close Chat">&times;</span>
                `;
                container.appendChild(tab);
            });
        }

        function renderActiveMessages() {
            const box = document.getElementById('messages');
            box.innerHTML = "";
            if (!activeRoomCode || !roomMessages[activeRoomCode]) return;

            roomMessages[activeRoomCode].forEach(msgObj => {
                box.appendChild(createMessageDOMElement(msgObj));
            });
            box.scrollTop = box.scrollHeight;
        }

        function createMessageDOMElement(msgObj) {
            if (msgObj.isSystem) {
                const div = document.createElement('div');
                div.style.textAlign = 'center';
                div.style.fontSize = '11px';
                div.style.color = '#a1a1aa';
                div.style.margin = '4px 0';
                div.innerText = msgObj.text;
                return div;
            }

            const isLooking = userFocusStates[msgObj.username] !== false;
            const eyeIcon = isLooking ? '👁️' : '🙈';
            const eyeClass = isLooking ? 'looking' : 'away';

            const div = document.createElement('div');
            div.className = `msg ${msgObj.isSelf ? 'self' : ''}`;
            
            div.innerHTML = `
                <div class="sender-header">
                    <span>${msgObj.isSelf ? 'You' : escape(msgObj.sender)}</span>
                    <span class="user-eye ${eyeClass}" data-username="${escape(msgObj.username)}" title="${isLooking ? 'Currently looking at chat' : 'Away / Closed tab'}">${eyeIcon}</span>
                </div>
                ${escape(msgObj.text)}
            `;
            return div;
        }

        function updateUserEyeElements(username, looking) {
            const eyeElements = document.querySelectorAll(`.user-eye[data-username="${username}"]`);
            eyeElements.forEach(eye => {
                eye.innerText = looking ? '👁️' : '🙈';
                eye.className = `user-eye ${looking ? 'looking' : 'away'}`;
                eye.title = looking ? 'Currently looking at chat' : 'Away / Closed tab';
            });
        }

        function addMsgToRoom(roomCode, sender, username, text, isSelf, looking) {
            const msgObj = {
                sender: sender,
                username: username,
                text: text,
                isSelf: isSelf,
                isSystem: false
            };

            if (!roomMessages[roomCode]) roomMessages[roomCode] = [];
            roomMessages[roomCode].push(msgObj);

            if (roomCode === activeRoomCode) {
                const box = document.getElementById('messages');
                box.appendChild(createMessageDOMElement(msgObj));
                box.scrollTop = box.scrollHeight;
            }
        }

        function addSystemMsgToRoom(roomCode, text) {
            const msgObj = { text: text, isSystem: true };

            if (!roomMessages[roomCode]) roomMessages[roomCode] = [];
            roomMessages[roomCode].push(msgObj);

            if (roomCode === activeRoomCode) {
                const box = document.getElementById('messages');
                box.appendChild(createMessageDOMElement(msgObj));
                box.scrollTop = box.scrollHeight;
            }
        }

        function directInviteFriend(friendUsername) {
            if (!activeRoomCode) {
                alert("You need to join or create a room first!");
                return;
            }

            pubnub.publish({
                channel: "user_direct_" + friendUsername,
                message: {
                    type: 'direct_room_invite',
                    from: myName,
                    fromUsername: myUsername,
                    roomCode: activeRoomCode
                }
            });

            addSystemMsg(`Sent a room invite to @${friendUsername}!`);
        }

        function acceptRoomInvite() {
            document.getElementById('invite-popup-overlay').style.display = 'none';
            if (pendingInviteRoomCode) {
                connectToRoom(pendingInviteRoomCode);
            }
        }

        function declineRoomInvite() {
            document.getElementById('invite-popup-overlay').style.display = 'none';
            pendingInviteRoomCode = "";
        }

        function toggleInbox() {
            const modal = document.getElementById('inbox-modal');
            const isShowing = modal.style.display === 'flex';
            modal.style.display = isShowing ? 'none' : 'flex';
            if (!isShowing) {
                document.getElementById('mail-badge').classList.remove('active');
                renderInbox();
            }
        }

        function switchInboxTab(tab) {
            currentTab = tab;
            document.getElementById('tab-requests').classList.toggle('active', tab === 'requests');
            document.getElementById('tab-system').classList.toggle('active', tab === 'system');
            renderInbox();
        }

        function renderInbox() {
            const container = document.getElementById('inbox-content');
            container.innerHTML = "";

            if (currentTab === 'requests') {
                if (incomingRequests.length === 0) {
                    container.innerHTML = `<span style="font-size:11px; color:#a1a1aa;">No pending friend requests</span>`;
                    return;
                }
                incomingRequests.forEach(req => {
                    const card = document.createElement('div');
                    card.className = "req-card";
                    card.innerHTML = `
                        <div style="display:flex; flex-direction:column;">
                            <span style="font-size:11px; font-weight:600;">${escape(req.displayName)}</span>
                            <span style="font-size:9px; color:#6b7280;">@${escape(req.username)}</span>
                        </div>
                        <div class="req-actions">
                            <button type="button" class="btn-accept" onclick="acceptRequest('${escape(req.displayName)}', '${escape(req.username)}')">Accept</button>
                            <button type="button" class="btn-decline" onclick="declineRequest('${escape(req.username)}')">Decline</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                if (systemMessages.length === 0) {
                    container.innerHTML = `<span style="font-size:11px; color:#a1a1aa;">No system messages</span>`;
                    return;
                }
                systemMessages.forEach(msg => {
                    const card = document.createElement('div');
                    card.className = "req-card";
                    card.innerHTML = `<span style="font-size:11px;">${escape(msg)}</span>`;
                    container.appendChild(card);
                });
            }
        }

        function sendFriendRequest() {
            const input = document.getElementById('friend-input');
            const friendHandle = input.value.trim().toLowerCase().replace('@', '');
            if (!friendHandle || !pubnub) return;

            if (friendHandle === myUsername) {
                alert("You cannot add yourself!");
                return;
            }

            pubnub.publish({
                channel: "user_direct_" + friendHandle,
                message: {
                    type: 'friend_request',
                    from: myName,
                    fromUsername: myUsername
                }
            });

            addSystemMsg(`Sent a friend request to @${friendHandle}!`);
            input.value = "";
        }

        function acceptRequest(fromName, fromUsername) {
            const isAlreadyFriend = friends.some(f => f.username === fromUsername);
            if (!isAlreadyFriend) {
                friends.push({ displayName: fromName, username: fromUsername });
                localStorage.setItem("chat_friends_" + myUsername, JSON.stringify(friends));
                renderFriends();
            }

            incomingRequests = incomingRequests.filter(u => u.username !== fromUsername);
            renderInbox();

            pubnub.publish({
                channel: "user_direct_" + fromUsername,
                message: {
                    type: 'friend_accept',
                    from: myName,
                    fromUsername: myUsername
                }
            });

            addSystemMsg(`You are now friends with ${fromName}!`);
        }

        function declineRequest(fromUsername) {
            incomingRequests = incomingRequests.filter(u => u.username !== fromUsername);
            renderInbox();
        }

        function removeFriend(index) {
            const friend = friends[index];
            const confirmed = confirm(`Are you sure you want to delete ${friend.displayName} (@${friend.username}) from your friends list?`);
            if (confirmed) {
                friends.splice(index, 1);
                localStorage.setItem("chat_friends_" + myUsername, JSON.stringify(friends));
                renderFriends();
            }
        }

        function renderFriends() {
            const list = document.getElementById('friends-list');
            list.innerHTML = "";

            friends.forEach((friend, idx) => {
                const isOnline = activeUsers.has(friend.username);
                const card = document.createElement('div');
                card.className = "friend-card";
                card.innerHTML = `
                    <div class="friend-info">
                        <div class="status-dot ${isOnline ? 'online' : ''}"></div>
                        <div class="friend-details">
                            <span class="friend-name">${escape(friend.displayName)}</span>
                            <span class="friend-handle">@${escape(friend.username)}</span>
                        </div>
                    </div>
                    <div class="friend-actions">
                        <button type="button" class="btn-invite-friend" onclick="directInviteFriend('${escape(friend.username)}')">Invite</button>
                        <span class="remove-friend" onclick="removeFriend(${idx})" title="Delete Friend">&times;</span>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function promptJoinRoom() {
            const code = prompt("Enter a Room Code (e.g. CHAT99 or create a new code):");
            if (code && code.trim()) {
                connectToRoom(code.trim());
                if (window.innerWidth <= 768) {
                    toggleSidebar();
                }
            }
        }

        function inviteFriend() {
            if (!activeRoomCode) {
                alert("Please join or create a room first!");
                return;
            }

            const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${activeRoomCode}`;

            navigator.clipboard.writeText(inviteUrl).then(() => {
                addSystemMsg("🔗 Room invite link copied to clipboard!");
            }).catch(() => {
                addSystemMsg(`Share this code with friends: ${activeRoomCode}`);
            });
        }

        function send() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();

            if (!activeRoomCode || !pubnub) {
                alert("Please join or create a room first!");
                return;
            }

            if (!text) return;

            addMsgToRoom(activeRoomCode, myName, myUsername, text, true, isUserLooking);
            input.value = "";

            pubnub.publish({
                channel: "room_code_" + activeRoomCode,
                message: {
                    senderId: myId,
                    sender: myName,
                    username: myUsername,
                    text: text,
                    looking: isUserLooking
                }
            });
        }

        function setOnline() {
            const badge = document.getElementById('status-badge');
            badge.innerText = "Connected Live!";
            badge.classList.add('online');
        }

        function addSystemMsg(text) {
            if (!activeRoomCode) return;
            addSystemMsgToRoom(activeRoomCode, text);
        }

        function escape(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
