<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTerminal Local Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ffcc;
            --primary-glow: rgba(0, 255, 204, 0.4);
            --secondary: #ff007f;
            --bg-dark: #0a0a12;
            --bg-panel: #121222;
            --text-main: #e0e0ff;
            --text-accent: #8a8ab0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        #sidebar {
            width: 280px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--primary-glow);
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }

        .sidebar-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary-glow);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #status-badge {
            font-size: 10px;
            padding: 3px 6px;
            border: 1px solid var(--primary);
            color: var(--primary);
            box-shadow: 0 0 5px var(--primary-glow);
        }

        #tabs-list {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .chat-tab {
            padding: 8px 10px;
            margin-bottom: 5px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid transparent;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .chat-tab.active {
            background: rgba(0, 255, 204, 0.1);
            border-left-color: var(--primary);
            color: var(--primary);
            box-shadow: inset 0 0 10px var(--primary-glow);
        }

        .tab-close-btn {
            font-size: 14px;
            color: var(--text-accent);
            cursor: pointer;
        }
        .tab-close-btn:hover { color: var(--secondary); }

        /* Main Window */
        #main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
        }

        #chat-header {
            padding: 15px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--primary-glow);
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: var(--primary);
            text-shadow: 0 0 8px var(--primary-glow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 14px;
            max-width: 70%;
            border-radius: 4px;
        }

        .msg.self {
            align-self: flex-end;
            border-color: var(--primary-glow);
            background: rgba(0, 255, 204, 0.03);
        }

        .sender-header {
            font-size: 11px;
            color: var(--text-accent);
            margin-bottom: 4px;
        }

        /* Input Area */
        #input-area {
            padding: 15px;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--primary-glow);
            display: flex;
            gap: 10px;
        }

        #message-input {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--text-accent);
            color: var(--text-main);
            padding: 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            outline: none;
        }

        #message-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        button {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--primary);
            color: var(--bg-dark);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .instructions {
            background: rgba(0, 255, 204, 0.05);
            border: 1px dashed var(--primary);
            padding: 10px;
            margin-bottom: 10px;
            font-size: 11px;
            color: var(--text-accent);
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <span>CHANNELS</span>
            <div id="status-badge">ONLINE</div>
        </div>
        <div class="instructions">
            <strong>No API keys needed!</strong> Open this exact file in two different browser tabs/windows to chat between them locally using BroadcastChannel.
        </div>
        <div id="tabs-list"></div>
        <button type="button" onclick="promptJoinRoom()">+ JOIN / CREATE</button>
    </div>

    <div id="main-chat">
        <div id="chat-header">
            <span id="room-display">Channel: None</span>
            <button type="button" onclick="leaveCurrentRoom()">LEAVE</button>
        </div>

        <div id="messages">
            <div style="text-align:center; color:var(--text-accent); font-size:12px; margin-top:20px; font-family:'Orbitron',sans-serif;">
                Join a channel to start messaging!
            </div>
        </div>

        <div id="input-area">
            <input type="text" id="message-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') send()">
            <button type="button" onclick="send()">TRANSMIT</button>
        </div>
    </div>

    <script>
        // Simple multi-tab chat using browser's BroadcastChannel API (Zero API Keys required)
        let myUsername = "operator_" + Math.floor(Math.random() * 1000);
        let activeRoomCode = "";
        let openRooms = [];
        let roomMessages = {};
        let activeChannel = null;

        window.addEventListener('DOMContentLoaded', () => {
            // Automatically join a default room on startup so you can see it work immediately
            connectToRoom("GENERAL");
        });

        function connectToRoom(rawCode) {
            const code = rawCode.toUpperCase();
            if (!openRooms.includes(code)) {
                openRooms.push(code);
                roomMessages[code] = roomMessages[code] || [];
            }
            switchRoomTab(code);
        }

        function switchRoomTab(code) {
            activeRoomCode = code;
            document.getElementById('room-display').innerText = `Channel: #${code}`;

            // Close previous broadcast listener if any
            if (activeChannel) {
                activeChannel.close();
            }

            // Listen to browser-local cross-tab messages for this specific room
            activeChannel = new BroadcastChannel("cyber_chat_" + code);
            activeChannel.onmessage = function (event) {
                const data = event.data;
                if (data.username !== myUsername) {
                    addMsgToRoom(activeRoomCode, data.sender, data.username, data.text, false);
                }
            };

            renderTabs();
            renderActiveMessages();
        }

        function leaveCurrentRoom() {
            if (!activeRoomCode) return;
            openRooms = openRooms.filter(r => r !== activeRoomCode);
            delete roomMessages[activeRoomCode];
            if (activeChannel) activeChannel.close();

            if (openRooms.length > 0) {
                switchRoomTab(openRooms[0]);
            } else {
                activeRoomCode = "";
                document.getElementById('room-display').innerText = "Channel: None";
                document.getElementById('messages').innerHTML = `<div style="text-align:center; color:var(--text-accent); font-size:12px; margin-top:20px; font-family:'Orbitron',sans-serif;">No active channels.</div>`;
                renderTabs();
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabs-list');
            container.innerHTML = "";
            openRooms.forEach(room => {
                const tab = document.createElement('div');
                tab.className = `chat-tab ${room === activeRoomCode ? 'active' : ''}`;
                tab.onclick = () => switchRoomTab(room);
                tab.innerHTML = `
                    <span># ${room}</span>
                    <span class="tab-close-btn" onclick="event.stopPropagation(); closeRoomTab('${room}')">&times;</span>
                `;
                container.appendChild(tab);
            });
        }

        function closeRoomTab(code) {
            if (code === activeRoomCode) {
                leaveCurrentRoom();
            } else {
                openRooms = openRooms.filter(r => r !== code);
                delete roomMessages[code];
                renderTabs();
            }
        }

        function renderActiveMessages() {
            const box = document.getElementById('messages');
            box.innerHTML = "";
            if (!activeRoomCode || !roomMessages[activeRoomCode]) return;

            roomMessages[activeRoomCode].forEach(msgObj => {
                box.appendChild(createMessageDOM(msgObj));
            });
            box.scrollTop = box.scrollHeight;
        }

        function createMessageDOM(msgObj) {
            const div = document.createElement('div');
            div.className = `msg ${msgObj.isSelf ? 'self' : ''}`;
            div.innerHTML = `
                <div class="sender-header">${msgObj.isSelf ? 'You (' + myUsername + ')' : escapeHtml(msgObj.sender)}</div>
                ${escapeHtml(msgObj.text)}
            `;
            return div;
        }

        function addMsgToRoom(roomCode, sender, username, text, isSelf) {
            const msgObj = { sender, username, text, isSelf };
            if (!roomMessages[roomCode]) roomMessages[roomCode] = [];
            roomMessages[roomCode].push(msgObj);

            if (roomCode === activeRoomCode) {
                const box = document.getElementById('messages');
                box.appendChild(createMessageDOM(msgObj));
                box.scrollTop = box.scrollHeight;
            }
        }

        function promptJoinRoom() {
            const code = prompt("Enter Channel Name (e.g. LOBBY, SQUAD):");
            if (code && code.trim()) {
                connectToRoom(code.trim());
            }
        }

        function send() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !activeRoomCode) return;

            addMsgToRoom(activeRoomCode, myUsername, myUsername, text, true);
            input.value = "";

            // Broadcast message to any other open tabs/windows tuned to this room
            if (activeChannel) {
                activeChannel.postMessage({
                    sender: myUsername,
                    username: myUsername,
                    text: text
                });
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
