<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Terminal - Max Connect</title>
    <style>
        body { 
            background-color: #030308; 
            color: #00f0ff; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 20px; 
        }
        .box { 
            border: 2px solid #7b68ee; 
            padding: 20px; 
            max-width: 600px; 
            margin: 0 auto; 
            background: #070714; 
        }
        input, button { 
            padding: 10px; 
            margin: 5px 0; 
            width: 100%; 
            box-sizing: border-box; 
            background: #020208; 
            color: #00f0ff; 
            border: 1px solid #1a103c; 
        }
        button { 
            background: #2e1a47; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover { 
            background: #4b0082; 
        }
        #status { 
            color: #ff3366; 
            font-weight: bold; 
            margin-bottom: 10px; 
        }
        .log { 
            height: 300px; 
            overflow-y: auto; 
            border: 1px solid #1a103c; 
            padding: 10px; 
            margin-top: 10px; 
            background: #000; 
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>TERMINAL LINK</h2>
        <div id="status">Status: Attempting Server Connection...</div>
        <div>Your ID: <span id="my-id">Loading...</span></div>
        <hr style="border-color: #1a103c; margin: 15px 0;">
        
        <input type="text" id="target-id" placeholder="Enter Friend's ID to Connect">
        <button onclick="connectToPeer()">// CONNECT TO FRIEND</button>
        
        <div class="log" id="chat-log"></div>
        
        <input type="text" id="msg-input" placeholder="Type message...">
        <button onclick="sendMessage()">// SEND</button>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const logEl = document.getElementById('chat-log');
        let peer = null;
        let activeConnection = null;

        function log(msg, color = '#00f0ff') {
            logEl.innerHTML += `<div style="color: ${color};">> ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // AGGRESSIVE CONNECTION CONFIGURATION
        function initSetup() {
            const seed = 'cyber_' + Math.floor(Math.random() * 90000 + 10000);
            
            peer = new Peer(seed, {
                host: '0.peerjs.com',
                port: 443,
                secure: true,
                // Extra servers to help punch through strict NATs/Firewalls
                config: {
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' }
                    ]
                }
            });

            peer.on('open', (id) => {
                statusEl.innerText = "Status: ONLINE ⚡";
                statusEl.style.color = "#00ff00";
                document.getElementById('my-id').innerText = id;
                log("Successfully connected to the main signaling server.", "#00ff00");
            });

            peer.on('error', (err) => {
                statusEl.innerText = "Status: NETWORK BLOCKED ❌";
                log(`FATAL ERROR: ${err.type} - Your network is blocking the connection.`, "#ff3366");
                console.error(err);
            });

            peer.on('connection', (conn) => {
                activeConnection = conn;
                setupConnectionEvents();
                log(`Incoming connection from: ${conn.peer}`, "#ffff00");
            });
        }

        function connectToPeer() {
            const target = document.getElementById('target-id').value.trim();
            if (!target) return alert("Enter an ID");
            if (!peer || peer.disconnected) return alert("You are offline. Network blocked.");

            log(`Attempting connection to ${target}...`);
            activeConnection = peer.connect(target);
            setupConnectionEvents();
        }

        function setupConnectionEvents() {
            activeConnection.on('open', () => {
                log(`Secure link established with ${activeConnection.peer}`, "#00ff00");
            });
            activeConnection.on('data', (data) => {
                log(`[FRIEND]: ${data}`);
            });
            activeConnection.on('close', () => {
                log("Connection lost.", "#ff3366");
                activeConnection = null;
            });
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const msg = input.value.trim();
            if (!msg) return;

            if (activeConnection && activeConnection.open) {
                activeConnection.send(msg);
                log(`[YOU]: ${msg}`);
                input.value = '';
            } else {
                alert("Not connected to anyone!");
            }
        }

        // Start booting immediately
        initSetup();
    </script>
</body>
</html>
